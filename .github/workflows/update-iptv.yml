name: Update JP-VN IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build IPTV playlist
        run: |
          python - <<'PY'
          import json
          import urllib.request

          API = "https://iptv-org.github.io/api"

          URL_CHANNELS = f"{API}/channels.json"
          URL_FEEDS = f"{API}/feeds.json"
          URL_STREAMS = f"{API}/streams.json"

          def get_json(url):
              print("Downloading:", url)

              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )

              with urllib.request.urlopen(req, timeout=180) as response:
                  return json.loads(
                      response.read().decode(
                          "utf-8",
                          errors="ignore"
                      )
                  )

          print("========================================")
          print("Downloading iptv-org API")
          print("========================================")

          channels = get_json(URL_CHANNELS)
          feeds = get_json(URL_FEEDS)
          streams = get_json(URL_STREAMS)

          print("Channels:", len(channels))
          print("Feeds:", len(feeds))
          print("Streams:", len(streams))

          # ========================================================
          # LANGUAGES
          # ========================================================

          JAPANESE = "jpn"
          VIETNAMESE = "vie"
          ENGLISH = "eng"

          # ========================================================
          # ENGLISH CATEGORIES WANTED
          # ========================================================

          ENGLISH_ALLOWED = {
              "animation",
              "children",
              "education",
              "entertainment",
              "family",
              "movies",
              "music",
              "science",
              "series",
              "sports",
              "documentary"
          }

          # Categories we definitely do NOT want
          BLOCKED_CATEGORIES = {
              "adult",
              "religious",
              "shop",
              "shopping",
              "weather",
              "business",
              "legislative"
          }

          # ========================================================
          # BLOCKED CHANNEL NAMES
          # ========================================================

          BLOCKED_NAMES = {
              "pluto",
              "pluto tv"
          }

          def channel_name(channel):
              return (
                  channel.get("name")
                  or channel.get("native_name")
                  or channel.get("id")
                  or "Unknown"
              )

          def categories(channel):
              result = set()

              value = channel.get("categories", [])

              if isinstance(value, list):
                  for item in value:
                      if isinstance(item, str):
                          result.add(item.lower())

              return result

          def languages(feed):
              result = set()

              value = feed.get("languages", [])

              if isinstance(value, list):
                  for item in value:
                      if isinstance(item, str):
                          result.add(item.lower())

              return result

          def is_blocked_name(name):
              name = name.lower()

              for word in BLOCKED_NAMES:
                  if word in name:
                      return True

              return False

          # ========================================================
          # CHANNEL MAP
          # ========================================================

          channel_map = {}

          for channel in channels:
              channel_id = channel.get("id")

              if channel_id:
                  channel_map[channel_id] = channel

          # ========================================================
          # FEEDS
          #
          # feed_id -> feed information
          # ========================================================

          feed_map = {}

          # channel -> feeds
          feeds_by_channel = {}

          for feed in feeds:
              channel_id = feed.get("channel")
              feed_id = feed.get("id")

              if not channel_id or not feed_id:
                  continue

              feed_map[feed_id] = feed

              feeds_by_channel.setdefault(
                  channel_id,
                  []
              ).append(feed)

          # ========================================================
          # STREAMS
          #
          # channel -> list of streams
          # ========================================================

          streams_by_channel = {}

          for stream in streams:
              channel_id = stream.get("channel")

              if not channel_id:
                  continue

              streams_by_channel.setdefault(
                  channel_id,
                  []
              ).append(stream)

          # ========================================================
          # STREAM SCORE
          # ========================================================

          def score_stream(stream):

              score = 0

              url = str(
                  stream.get("url", "")
              ).lower()

              label = str(
                  stream.get("label", "")
              ).lower()

              quality = str(
                  stream.get("quality", "")
              ).lower()

              # HTTPS preferred
              if url.startswith("https://"):
                  score += 30

              # HLS preferred
              if ".m3u8" in url:
                  score += 40

              # Quality
              if "1080" in quality:
                  score += 30

              elif "720" in quality:
                  score += 20

              elif "576" in quality:
                  score += 10

              # Online streams
              if str(
                  stream.get("status", "")
              ).lower() == "online":
                  score += 50

              # Avoid obvious geo-blocked streams
              if "geo" in label:
                  score -= 100

              if "blocked" in label:
                  score -= 100

              return score

          # ========================================================
          # BUILD CANDIDATE FEEDS
          # ========================================================

          candidates = []

          for channel_id, channel in channel_map.items():

              name = channel_name(channel)

              if is_blocked_name(name):
                  continue

              channel_categories = categories(channel)

              # Never allow blocked categories
              if channel_categories & BLOCKED_CATEGORIES:
                  continue

              channel_feeds = feeds_by_channel.get(
                  channel_id,
                  []
              )

              for feed in channel_feeds:

                  feed_id = feed.get("id")

                  feed_languages = languages(feed)

                  # ------------------------------------------------
                  # JAPANESE
                  # ------------------------------------------------

                  if JAPANESE in feed_languages:

                      candidates.append({
                          "channel_id": channel_id,
                          "feed_id": feed_id,
                          "type": "JAPAN",
                          "channel": channel,
                          "feed": feed
                      })

                      continue

                  # ------------------------------------------------
                  # VIETNAMESE
                  # ------------------------------------------------

                  if VIETNAMESE in feed_languages:

                      candidates.append({
                          "channel_id": channel_id,
                          "feed_id": feed_id,
                          "type": "VIETNAM",
                          "channel": channel,
                          "feed": feed
                      })

                      continue

                  # ------------------------------------------------
                  # ENGLISH
                  #
                  # English must also have one of the wanted
                  # categories.
                  # ------------------------------------------------

                  if ENGLISH in feed_languages:

                      if channel_categories & ENGLISH_ALLOWED:

                          candidates.append({
                              "channel_id": channel_id,
                              "feed_id": feed_id,
                              "type": "ENGLISH",
                              "channel": channel,
                              "feed": feed
                          })

          print("========================================")
          print("Candidate feeds:", len(candidates))
          print("========================================")

          # ========================================================
          # FIND BEST STREAM FOR EACH FEED
          # ========================================================

          output = [
              "#EXTM3U"
          ]

          used_urls = set()

          count_japan = 0
          count_vietnam = 0
          count_english = 0

          for candidate in sorted(
              candidates,
              key=lambda x: (
                  x["type"],
                  channel_name(
                      x["channel"]
                  ).lower(),
                  x["feed_id"]
              )
          ):

              channel = candidate["channel"]
              feed = candidate["feed"]

              channel_id = candidate["channel_id"]
              feed_id = candidate["feed_id"]

              channel_type = candidate["type"]

              name = channel_name(channel)

              # ------------------------------------------------
              # Get streams for this channel
              # ------------------------------------------------

              channel_streams = streams_by_channel.get(
                  channel_id,
                  []
              )

              matching_streams = []

              for stream in channel_streams:

                  url = stream.get("url")

                  if not url:
                      continue

                  if not isinstance(url, str):
                      continue

                  url = url.strip()

                  if not url.startswith(
                      ("http://", "https://")
                  ):
                      continue

                  stream_feed = stream.get("feed")

                  # If stream explicitly specifies a feed,
                  # it must match this feed.
                  if stream_feed:
                      if stream_feed != feed_id:
                          continue

                  matching_streams.append(stream)

              if not matching_streams:
                  continue

              # ------------------------------------------------
              # Best stream first
              # ------------------------------------------------

              matching_streams.sort(
                  key=score_stream,
                  reverse=True
              )

              chosen = None

              for stream in matching_streams:

                  url = stream.get(
                      "url",
                      ""
                  ).strip()

                  if url in used_urls:
                      continue

                  chosen = stream
                  break

              if not chosen:
                  continue

              stream_url = chosen.get(
                  "url",
                  ""
              ).strip()

              if not stream_url:
                  continue

              used_urls.add(stream_url)

              # ------------------------------------------------
              # GROUP TITLE
              # ------------------------------------------------

              if channel_type == "JAPAN":

                  group = "🇯🇵 Japan"

                  count_japan += 1

              elif channel_type == "VIETNAM":

                  group = "🇻🇳 Vietnam"

                  count_vietnam += 1

              else:

                  channel_categories = categories(
                      channel
                  )

                  if (
                      "children" in channel_categories
                      or "animation" in channel_categories
                  ):

                      group = "🇬🇧 English | Kids"

                  elif (
                      "education" in channel_categories
                      or "science" in channel_categories
                  ):

                      group = "🇬🇧 English | Education"

                  elif "documentary" in channel_categories:

                      group = "🇬🇧 English | Documentary"

                  elif (
                      "movies" in channel_categories
                      or "series" in channel_categories
                  ):

                      group = "🇬🇧 English | Movies & Series"

                  elif "music" in channel_categories:

                      group = "🇬🇧 English | Music"

                  elif "sports" in channel_categories:

                      group = "🇬🇧 English | Sports"

                  elif "family" in channel_categories:

                      group = "🇬🇧 English | Family"

                  else:

                      group = "🇬🇧 English | Entertainment"

                  count_english += 1

              # ------------------------------------------------
              # TVG ID / LOGO
              # ------------------------------------------------

              tvg_id = channel.get(
                  "id",
                  ""
              )

              logo = channel.get(
                  "logo",
                  ""
              )

              # ------------------------------------------------
              # EXTINF
              # ------------------------------------------------

              extinf = (
                  '#EXTINF:-1'
                  f' tvg-id="{tvg_id}"'
                  f' tvg-name="{name}"'
                  f' group-title="{group}"'
              )

              if logo:
                  extinf += (
                      f' tvg-logo="{logo}"'
                  )

              extinf += f',{name}'

              output.append(extinf)
              output.append(stream_url)

          # ========================================================
          # WRITE PLAYLIST
          # ========================================================

          with open(
              "jp-vn.m3u",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  "\n".join(output)
              )

              file.write("\n")

          # ========================================================
          # FINAL REPORT
          # ========================================================

          total = (
              count_japan
              + count_vietnam
              + count_english
          )

          print("")
          print("========================================")
          print("PLAYLIST CREATED SUCCESSFULLY")
          print("========================================")
          print("Japan    :", count_japan)
          print("Vietnam  :", count_vietnam)
          print("English  :", count_english)
          print("----------------------------------------")
          print("TOTAL    :", total)
          print("========================================")

          if total == 0:
              raise RuntimeError(
                  "Playlist contains 0 channels. "
                  "Stopping workflow so an empty playlist "
                  "will NOT be committed."
              )

          PY

      - name: Check playlist
        run: |
          echo "Checking playlist..."

          if [ ! -s jp-vn.m3u ]; then
            echo "ERROR: jp-vn.m3u is empty."
            exit 1
          fi

          CHANNEL_COUNT=$(grep -c "^#EXTINF" jp-vn.m3u || true)

          echo "Playlist channel count: $CHANNEL_COUNT"

          if [ "$CHANNEL_COUNT" -eq 0 ]; then
            echo "ERROR: No channels found."
            exit 1
          fi

          echo "Playlist check OK."

      - name: Commit playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jp-vn.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update JP-VN IPTV playlist"

          git pull --rebase origin main

          git push origin main
