name: Update IPTV Playlist

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build IPTV playlist
        env:
          JAPAN_URL: "https://raw.githubusercontent.com/ZXArkin/my-personal-iptv/iptv-radio/Japan.m3u"
          VIETNAM_URL: "https://raw.githubusercontent.com/ZXArkin/my-personal-iptv/iptv-radio/ZXIPTV.m3u"
          ENGLISH_URL: "https://iptv-org.github.io/iptv/languages/eng.m3u"
          CATEGORY_URL: "https://iptv-org.github.io/iptv/index.category.m3u"

        run: |

          python3 <<'PY'

          import os
          import re
          import urllib.request
          from pathlib import Path

          # ============================================================
          # CONFIG
          # ============================================================

          JAPAN_URL = os.environ["JAPAN_URL"]
          VIETNAM_URL = os.environ["VIETNAM_URL"]
          ENGLISH_URL = os.environ["ENGLISH_URL"]
          CATEGORY_URL = os.environ["CATEGORY_URL"]

          OUTPUT = Path("jp-vn.m3u")
          TEMP = Path("jp-vn.m3u.tmp")

          USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/131.0 Safari/537.36"
          )

          # ============================================================
          # DOWNLOAD
          # ============================================================

          def download(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Accept": "*/*"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  return response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

          # ============================================================
          # PARSE M3U
          # ============================================================

          def parse_m3u(text):

              result = []
              current = None

              for line in text.splitlines():

                  line = line.strip()

                  if not line:
                      continue

                  if line.startswith("#EXTINF"):

                      current = {
                          "info": line,
                          "url": None
                      }

                  elif current and not line.startswith("#"):

                      current["url"] = line
                      result.append(current)
                      current = None

              return result

          # ============================================================
          # HELPERS
          # ============================================================

          def get_name(entry):

              info = entry["info"]

              if "," in info:
                  return info.split(",", 1)[1].strip()

              return ""

          def get_id(entry):

              match = re.search(
                  r'tvg-id="([^"]*)"',
                  entry["info"],
                  re.I
              )

              return match.group(1).strip() if match else ""

          def set_group(entry, group):

              info = entry["info"]

              if re.search(
                  r'group-title="[^"]*"',
                  info,
                  re.I
              ):

                  info = re.sub(
                      r'group-title="[^"]*"',
                      f'group-title="{group}"',
                      info,
                      flags=re.I
                  )

              else:

                  info = info.replace(
                      "#EXTINF:-1",
                      f'#EXTINF:-1 group-title="{group}"',
                      1
                  )

              return {
                  "info": info,
                  "url": entry["url"]
              }

          # ============================================================
          # JAPAN
          # ============================================================

          print("================================")
          print("JAPAN")
          print("================================")

          japan_source = download(JAPAN_URL)
          japan_entries = parse_m3u(japan_source)

          japan_result = []
          japan_seen = set()

          for entry in japan_entries:

              name = get_name(entry)
              tid = get_id(entry)

              key = (
                  tid.lower()
                  or name.lower()
              )

              if not key:
                  continue

              if key in japan_seen:
                  continue

              japan_seen.add(key)

              japan_result.append(
                  set_group(
                      entry,
                      "🇯🇵 Japan"
                  )
              )

          print(
              "Japan:",
              len(japan_result)
          )

          # ============================================================
          # VIETNAM
          #
          # IMPORTANT:
          # DO NOT FILTER VIETNAM BY KEYWORDS.
          # Keep the original source.
          # Only remove old VTV entries.
          # ============================================================

          print("================================")
          print("VIETNAM")
          print("================================")

          vietnam_source = download(VIETNAM_URL)
          vietnam_entries = parse_m3u(vietnam_source)

          def is_vtv(entry):

              name = get_name(entry).lower().strip()
              tid = get_id(entry).lower().strip()

              # VTV1 ... VTV9
              if re.match(
                  r"^vtv\s*[1-9]\s*(hd)?$",
                  name
              ):
                  return True

              if re.match(
                  r"^vtv[1-9](hd)?$",
                  tid
              ):
                  return True

              # VTV stream IDs such as VTV1.vn@HD
              if re.match(
                  r"^vtv[1-9]\.vn@",
                  tid
              ):
                  return True

              # VTV special channels
              special = [
                  "vtv5 tây nguyên",
                  "vtv5 tay nguyen",
                  "vtv5 tây nam bộ",
                  "vtv5 tay nam bo",
                  "vtv5 tnb",
                  "vtv cần thơ",
                  "vtv can tho",
                  "vtvct",
                  "vtv10"
              ]

              text = name + " " + tid

              if any(
                  x in text
                  for x in special
              ):
                  return True

              return False

          vietnam_result = []

          for entry in vietnam_entries:

              # Remove ONLY old VTV entries.
              if is_vtv(entry):
                  continue

              vietnam_result.append(
                  set_group(
                      entry,
                      "🇻🇳 Vietnam"
                  )
              )

          # Deduplicate while preserving source
          vietnam_seen = set()
          vietnam_clean = []

          for entry in vietnam_result:

              key = (
                  get_id(entry).lower()
                  or get_name(entry).lower()
              )

              if not key:
                  continue

              if key in vietnam_seen:
                  continue

              vietnam_seen.add(key)
              vietnam_clean.append(entry)

          print(
              "Vietnam:",
              len(vietnam_clean)
          )

          # ============================================================
          # VTV
          #
          # Official VTVGo CDN endpoints.
          #
          # NO GitHub-side stream test.
          # NO FPT 403 test.
          # ============================================================

          print("================================")
          print("VTV")
          print("================================")

          VTV = {

              "VTV1": (
                  "https://vtvgolive-failover.vtvdigital.vn/"
                  "vtvgo/vtv1-manifest.m3u8"
              ),

              "VTV2": (
                  "https://vtvgolive-failover.vtvdigital.vn/"
                  "vtvgo/vtv2-manifest.m3u8"
              ),

              "VTV3": (
                  "https://vtvgolive-failover.vtvdigital.vn/"
                  "vtvgo/vtv3-manifest.m3u8"
              ),

              "VTV4": (
                  "https://vtvgolive-failover.vtvdigital.vn/"
                  "vtvgo/vtv4-manifest.m3u8"
              ),

              "VTV5": (
                  "https://vtvgolive-failover.vtvdigital.vn/"
                  "vtvgo/vtv5-manifest.m3u8"
              ),

              "VTV6": (
                  "https://vtvgolive-failover.vtvdigital.vn/"
                  "vtvgo/vtv6-manifest.m3u8"
              ),

              "VTV7": (
                  "https://vtvgolive-failover.vtvdigital.vn/"
                  "vtvgo/vtv7-manifest.m3u8"
              ),

              "VTV8": (
                  "https://vtvgolive-failover.vtvdigital.vn/"
                  "vtvgo/vtv8-manifest.m3u8"
              ),

              "VTV9": (
                  "https://vtvgolive-failover.vtvdigital.vn/"
                  "vtvgo/vtv9-manifest.m3u8"
              ),

              "VTV Cần Thơ": (
                  "https://vtvgolive-failover.vtvdigital.vn/"
                  "vtvgo/vtvct-manifest.m3u8"
              )
          }

          VTV_LOGOS = {

              "VTV1":
                  "https://i.imgur.com/nfkmvAY.png",

              "VTV2":
                  "https://i.imgur.com/BVwi3K3.png",

              "VTV3":
                  "https://i.imgur.com/7rLCvgS.png",

              "VTV4":
                  "https://i.imgur.com/9zVTtsA.png",

              "VTV5":
                  "https://i.imgur.com/7qPKNFU.png",

              "VTV6":
                  "https://raw.githubusercontent.com/"
                  "ntd249/logochannel/refs/heads/main/VTV6.png",

              "VTV7":
                  "https://i.imgur.com/AgamSNe.png",

              "VTV8":
                  "https://i.imgur.com/lpcltL9.png",

              "VTV9":
                  "https://i.imgur.com/Ex1VkGQ.png"
          }

          vtv_result = []

          for channel, url in VTV.items():

              if channel == "VTV Cần Thơ":

                  tid = "VTV10.vn@HD"
                  logo = ""
                  display = "VTV Cần Thơ HD"

              else:

                  number = channel.replace(
                      "VTV",
                      ""
                  )

                  tid = (
                      f"VTV{number}.vn@HD"
                  )

                  logo = VTV_LOGOS.get(
                      channel,
                      ""
                  )

                  display = (
                      f"{channel} HD"
                  )

              info = (
                  '#EXTINF:-1 '
                  f'tvg-id="{tid}" '
                  'group-title="🇻🇳 VTV" '
                  f'tvg-logo="{logo}",'
                  f'{display}'
              )

              vtv_result.append({
                  "info": info,
                  "url": url
              })

          print(
              "VTV:",
              len(vtv_result)
          )

          # ============================================================
          # ENGLISH
          # ============================================================

          print("================================")
          print("ENGLISH")
          print("================================")

          english_source = download(
              ENGLISH_URL
          )

          english_entries = parse_m3u(
              english_source
          )

          category_source = download(
              CATEGORY_URL
          )

          category_entries = parse_m3u(
              category_source
          )

          categories = {}

          for entry in category_entries:

              tid = get_id(entry).lower()

              if not tid:
                  continue

              categories[tid] = (
                  get_name(entry)
                  + " "
                  + entry["info"]
              ).lower()

          # ============================================================
          # ENGLISH CATEGORIES
          # ============================================================

          wanted = [

              "kids",
              "children",
              "animation",
              "family",

              "education",
              "educational",

              "science",

              "documentary",
              "documentaries",

              "movie",
              "movies",
              "film",

              "series",

              "entertainment",

              "music",

              "sports",
              "sport",

              "news",

              "general",

              "lifestyle",

              "culture",

              "travel"
          ]

          blocked = [

              "adult",
              "xxx",
              "porn",

              "casino",
              "gambling",

              "shopping",

              "religion",
              "religious",

              "weather",

              "business",
              "stock",

              "legislative",
              "parliament",

              "court",

              "pluto"
          ]

          english_countries = {
              "us",
              "gb",
              "uk",
              "ca",
              "au",
              "nz",
              "ie"
          }

          global_brands = [

              "bbc",
              "bbc news",
              "bbc earth",

              "sky news",
              "sky cinema",
              "sky arts",
              "sky max",

              "itv",
              "channel 4",
              "channel 5",

              "abc",
              "cbs",
              "nbc",
              "fox",
              "pbs",

              "cnn",
              "cnbc",
              "msnbc",

              "national geographic",
              "nat geo",

              "discovery",
              "animal planet",
              "history",

              "smithsonian",

              "nickelodeon",
              "nick jr",
              "cartoon network",
              "cartoonito",
              "boomerang",

              "disney",

              "mtv",
              "vh1",

              "espn",
              "wwe",
              "eurosport",
              "tennis channel",

              "travel channel",
              "food network"
          ]

          def english_country(text):

              text = text.lower()

              for country in english_countries:

                  patterns = [

                      f".{country}",
                      f"@{country}",
                      f"_{country}",
                      f"-{country}",
                      f"({country})",
                      f" {country} "

                  ]

                  if any(
                      p in text
                      for p in patterns
                  ):
                      return True

              return False

          english_result = []

          for entry in english_entries:

              tid = get_id(entry).lower()
              name = get_name(entry).lower()
              info = entry["info"].lower()
              url = entry["url"].lower()

              text = (
                  tid
                  + " "
                  + name
                  + " "
                  + info
                  + " "
                  + url
              )

              # Block unwanted channels
              if any(
                  x in text
                  for x in blocked
              ):
                  continue

              category = categories.get(
                  tid,
                  ""
              )

              combined = (
                  text
                  + " "
                  + category
              )

              # Only requested categories
              if not any(
                  x in combined
                  for x in wanted
              ):
                  continue

              # English-speaking country
              # or major international English brand
              if not english_country(combined):

                  if not any(
                      brand in combined
                      for brand in global_brands
                  ):
                      continue

              english_result.append(
                  set_group(
                      entry,
                      "🇬🇧 English"
                  )
              )

          # ============================================================
          # DEDUP ENGLISH
          # ============================================================

          english_seen = {}

          for entry in english_result:

              key = (
                  get_id(entry).lower()
                  or get_name(entry).lower()
              )

              if not key:
                  continue

              if key not in english_seen:

                  english_seen[key] = entry

              else:

                  old = english_seen[key]

                  old_info = old["info"].lower()
                  new_info = entry["info"].lower()

                  old_hd = (
                      " hd" in old_info
                      or "1080" in old_info
                      or "720" in old_info
                  )

                  new_hd = (
                      " hd" in new_info
                      or "1080" in new_info
                      or "720" in new_info
                  )

                  if new_hd and not old_hd:
                      english_seen[key] = entry

          english_result = list(
              english_seen.values()
          )

          print(
              "English:",
              len(english_result)
          )

          # ============================================================
          # FINAL
          # ============================================================

          final_entries = (
              japan_result
              + vietnam_clean
              + vtv_result
              + english_result
          )

          total = len(final_entries)

          print("")
          print("================================")
          print("FINAL")
          print("================================")

          print(
              "Japan   :",
              len(japan_result)
          )

          print(
              "Vietnam :",
              len(vietnam_clean)
          )

          print(
              "VTV     :",
              len(vtv_result)
          )

          print(
              "English :",
              len(english_result)
          )

          print(
              "TOTAL   :",
              total
          )

          print("================================")

          # ============================================================
          # SAFETY
          # ============================================================

          if len(japan_result) < 30:

              raise RuntimeError(
                  "Japan source unexpectedly small."
              )

          if len(vietnam_clean) < 50:

              raise RuntimeError(
                  "Vietnam source unexpectedly small."
              )

          if len(vtv_result) != 10:

              raise RuntimeError(
                  "VTV list was not generated correctly."
              )

          if len(english_result) < 500:

              raise RuntimeError(
                  "English source unexpectedly small."
              )

          if total < 800:

              raise RuntimeError(
                  "Final playlist unexpectedly small."
              )

          # ============================================================
          # WRITE PLAYLIST
          # ============================================================

          output = []

          output.append("#EXTM3U")
          output.append("")
          output.append(
              "# ========================================"
          )
          output.append("# 🇯🇵 JAPAN")
          output.append(
              "# ========================================"
          )

          for entry in japan_result:

              output.append(
                  entry["info"]
              )

              output.append(
                  entry["url"]
              )

          output.append("")
          output.append(
              "# ========================================"
          )
          output.append("# 🇻🇳 VIETNAM")
          output.append(
              "# ========================================"
          )

          for entry in vietnam_clean:

              output.append(
                  entry["info"]
              )

              output.append(
                  entry["url"]
              )

          output.append("")
          output.append(
              "# ========================================"
          )
          output.append("# 🇻🇳 VTV")
          output.append(
              "# ========================================"
          )

          for entry in vtv_result:

              output.append(
                  entry["info"]
              )

              output.append(
                  entry["url"]
              )

          output.append("")
          output.append(
              "# ========================================"
          )
          output.append("# 🇬🇧 ENGLISH")
          output.append(
              "# ========================================"
          )

          for entry in english_result:

              output.append(
                  entry["info"]
              )

              output.append(
                  entry["url"]
              )

          TEMP.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )

          # ============================================================
          # FINAL VALIDATION
          # ============================================================

          generated = TEMP.read_text(
              encoding="utf-8"
          )

          channel_count = generated.count(
              "#EXTINF"
          )

          if channel_count < 800:

              raise RuntimeError(
                  "Generated playlist is unexpectedly small."
              )

          # Only now replace real playlist.
          TEMP.replace(
              OUTPUT
          )

          print("")
          print(
              "SUCCESS - playlist generated:",
              channel_count,
              "channels"
          )

          PY

      - name: Verify playlist
        run: |

          test -s jp-vn.m3u

          COUNT=$(grep -c '^#EXTINF' jp-vn.m3u || true)

          echo "Playlist channels: $COUNT"

          if [ "$COUNT" -lt 800 ]; then
            echo "ERROR: playlist too small"
            exit 1
          fi

          echo "Playlist OK"

      - name: Commit and push
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add jp-vn.m3u

          if git diff --cached --quiet; then

            echo "No changes."

          else

            git commit \
              -m "Update Japan Vietnam VTV English IPTV"

            git push

          fi
