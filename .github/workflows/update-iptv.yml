name: Update Stable JP-VN-English IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build stable playlist
        shell: bash
        run: |
          python3 <<'PY'
          import urllib.request
          import re
          import sys

          OUTPUT = "jp-vn.m3u"

          # ============================================================
          # SOURCES
          # ============================================================

          JAPAN_URL = (
              "https://raw.githubusercontent.com/"
              "cherryand1112-creator/IPTV-JP/main/JP.m3u"
          )

          VIETNAM_URL = (
              "https://raw.githubusercontent.com/"
              "ZXArkin/my-personal-iptv/iptv-radio/ZXIPTV.m3u"
          )

          ENGLISH_URL = (
              "https://iptv-org.github.io/iptv/languages/eng.m3u"
          )

          # ============================================================
          # DOWNLOAD
          # ============================================================

          def download(url):
              print("Downloading:")
              print(url)

              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=60
              ) as response:

                  data = response.read()

              if not data:
                  raise RuntimeError(
                      "Downloaded file is empty"
                  )

              return data.decode(
                  "utf-8",
                  errors="replace"
              )

          # ============================================================
          # M3U PARSER
          # ============================================================

          def parse_m3u(text):
              lines = text.splitlines()

              entries = []

              current_extinf = None
              options = []

              for raw in lines:

                  line = raw.strip()

                  if not line:
                      continue

                  if line.startswith("#EXTINF:"):

                      current_extinf = line
                      options = []

                      continue

                  if line.startswith("#EXTVLCOPT:"):

                      options.append(line)

                      continue

                  if line.startswith("#"):

                      continue

                  if (
                      current_extinf
                      and (
                          line.startswith("http://")
                          or line.startswith("https://")
                      )
                  ):

                      entries.append(
                          (
                              current_extinf,
                              options[:],
                              line
                          )
                      )

                      current_extinf = None
                      options = []

              return entries

          # ============================================================
          # NAME
          # ============================================================

          def get_name(extinf):

              if "," in extinf:

                  return (
                      extinf.split(",", 1)[1]
                      .strip()
                  )

              return "Unknown"

          # ============================================================
          # GROUP
          # ============================================================

          def get_group(extinf):

              m = re.search(
                  r'group-title="([^"]*)"',
                  extinf,
                  re.I
              )

              if m:
                  return m.group(1).strip()

              return ""

          # ============================================================
          # TVG ID
          # ============================================================

          def get_tvg_id(extinf):

              m = re.search(
                  r'tvg-id="([^"]*)"',
                  extinf,
                  re.I
              )

              if m:
                  return m.group(1).strip()

              return ""

          # ============================================================
          # REPLACE GROUP
          # ============================================================

          def set_group(extinf, group):

              if re.search(
                  r'group-title="[^"]*"',
                  extinf,
                  re.I
              ):

                  return re.sub(
                      r'group-title="[^"]*"',
                      'group-title="' + group + '"',
                      extinf,
                      count=1,
                      flags=re.I
                  )

              return extinf.replace(
                  "#EXTINF:-1",
                  '#EXTINF:-1 group-title="' + group + '"',
                  1
              )

          # ============================================================
          # NORMALIZE NAME
          # ============================================================

          def normalize_name(name):

              name = re.sub(
                  r'\s*\(\d{3,4}p\)',
                  "",
                  name,
                  flags=re.I
              )

              name = re.sub(
                  r'\s+',
                  " ",
                  name
              )

              return name.strip().lower()

          # ============================================================
          # LOAD SOURCES
          # ============================================================

          print("")
          print("================================")
          print("DOWNLOADING SOURCES")
          print("================================")

          try:
              jp_text = download(JAPAN_URL)
          except Exception as e:
              print("ERROR Japan:", e)
              sys.exit(1)

          try:
              vn_text = download(VIETNAM_URL)
          except Exception as e:
              print("ERROR Vietnam:", e)
              sys.exit(1)

          try:
              en_text = download(ENGLISH_URL)
          except Exception as e:
              print("ERROR English:", e)
              sys.exit(1)

          # ============================================================
          # PARSE
          # ============================================================

          jp_entries = parse_m3u(jp_text)
          vn_entries = parse_m3u(vn_text)
          en_entries = parse_m3u(en_text)

          print("")
          print("Raw Japan   :", len(jp_entries))
          print("Raw Vietnam :", len(vn_entries))
          print("Raw English :", len(en_entries))

          # ============================================================
          # OUTPUT
          # ============================================================

          result = []

          seen_japan = set()
          seen_vietnam = set()
          seen_english = set()

          # ============================================================
          # JAPAN
          #
          # Direct JP.m3u.
          # No streams.json replacement.
          # No URL rewriting.
          # ============================================================

          for extinf, options, url in jp_entries:

              name = get_name(extinf)
              tvg_id = get_tvg_id(extinf)

              key = (
                  tvg_id
                  or normalize_name(name)
              )

              if not key:
                  continue

              if key in seen_japan:
                  continue

              seen_japan.add(key)

              extinf = set_group(
                  extinf,
                  "Japan"
              )

              result.append(
                  (
                      "Japan",
                      extinf,
                      options,
                      url
                  )
              )

          # ============================================================
          # VIETNAM
          #
          # Take Vietnamese entries from ZXIPTV.
          #
          # Detection:
          # - .vn tvg-id
          # - Vietnam group
          # - Vietnamese channel names
          # - common VTV/HTV/VTC/THVL names
          # ============================================================

          vietnam_keywords = [
              "vtv",
              "htv",
              "htvc",
              "vtc",
              "thvl",
              "truyen hinh",
              "truyền hình",
              "hanoi",
              "hà nội",
              "hcm",
              "tphcm",
              "ho chi minh",
              "ho chi minh city",
              "da nang",
              "đà nẵng",
              "hai phong",
              "hải phòng",
              "can tho",
              "cần thơ",
              "binh duong",
              "bình dương",
              "dong nai",
              "đồng nai",
              "quang ninh",
              "quảng ninh",
              "khanh hoa",
              "khánh hòa",
              "dak lak",
              "đắk lắk",
              "lam dong",
              "lâm đồng",
              "tay ninh",
              "tây ninh",
              "vinh long",
              "vĩnh long",
              "bac lieu",
              "bạc liêu",
              "ca mau",
              "cà mau",
              "kien giang",
              "kiên giang",
              "an giang",
              "đồng tháp",
              "dong thap",
              "tien giang",
              "tiền giang",
              "long an",
              "ben tre",
              "bến tre",
              "tra vinh",
              "trà vinh",
              "soc trang",
              "sóc trăng",
              "hau giang",
              "hậu giang",
              "binh phuoc",
              "bình phước",
              "binh thuan",
              "bình thuận",
              "ninh thuan",
              "ninh thuận",
              "phu yen",
              "phú yên",
              "gia lai",
              "kon tum",
              "dak nong",
              "đắk nông",
              "thanh hoa",
              "thanh hóa",
              "nghe an",
              "nghệ an",
              "ha tinh",
              "hà tĩnh",
              "quang binh",
              "quảng bình",
              "quang tri",
              "quảng trị",
              "thua thien",
              "huế",
              "hue",
              "quang nam",
              "quảng nam",
              "quang ngai",
              "quảng ngãi",
              "binh dinh",
              "bình định",
              "phu tho",
              "phú thọ",
              "thai nguyen",
              "thái nguyên",
              "bac ninh",
              "bắc ninh",
              "bac giang",
              "bắc giang",
              "hai duong",
              "hải dương",
              "hung yen",
              "hưng yên",
              "nam dinh",
              "nam định",
              "ninh binh",
              "ninh bình",
              "thai binh",
              "thái bình",
              "lao cai",
              "lào cai",
              "yen bai",
              "yên bái",
              "son la",
              "sơn la",
              "dien bien",
              "điện biên",
              "lai chau",
              "lai châu",
              "lang son",
              "lạng sơn",
              "cao bang",
              "cao bằng",
              "bac kan",
              "bắc kạn",
              "tuyen quang",
              "tuyên quang",
              "ha giang",
              "hà giang"
          ]

          for extinf, options, url in vn_entries:

              name = get_name(extinf)
              tvg_id = get_tvg_id(extinf)
              group = get_group(extinf)

              combined = (
                  (
                      name
                      + " "
                      + tvg_id
                      + " "
                      + group
                  )
                  .lower()
              )

              is_vietnam = False

              if tvg_id.lower().endswith(".vn"):
                  is_vietnam = True

              if (
                  "vietnam" in group.lower()
                  or "việt nam" in group.lower()
              ):
                  is_vietnam = True

              for keyword in vietnam_keywords:

                  if keyword in combined:

                      is_vietnam = True
                      break

              if not is_vietnam:
                  continue

              # Skip obvious radio/audio entries
              if any(
                  x in combined
                  for x in [
                      "radio",
                      "fm ",
                      "am ",
                      "podcast"
                  ]
              ):
                  continue

              key = (
                  tvg_id
                  or normalize_name(name)
              )

              if not key:
                  continue

              if key in seen_vietnam:
                  continue

              seen_vietnam.add(key)

              extinf = set_group(
                  extinf,
                  "Vietnam"
              )

              result.append(
                  (
                      "Vietnam",
                      extinf,
                      options,
                      url
                  )
              )

          # ============================================================
          # ENGLISH
          #
          # Keep only requested categories.
          # No Pluto TV.
          # No non-English language expansion.
          # ============================================================

          wanted_categories = {
              "animation",
              "children",
              "kids",
              "education",
              "entertainment",
              "family",
              "movies",
              "music",
              "science",
              "series",
              "sports",
              "documentary"
          }

          blocked_categories = {
              "adult",
              "xxx",
              "religious",
              "shopping",
              "shop",
              "weather",
              "business",
              "legislative",
              "gambling"
          }

          english_country_codes = {
              "us",
              "gb",
              "ca",
              "au",
              "nz",
              "ie"
          }

          learning_categories = {
              "animation",
              "children",
              "kids",
              "education",
              "family",
              "science",
              "documentary"
          }

          for extinf, options, url in en_entries:

              name = get_name(extinf)
              tvg_id = get_tvg_id(extinf)
              group = get_group(extinf)

              low = (
                  extinf
                  + " "
                  + name
                  + " "
                  + group
              ).lower()

              # Remove Pluto TV completely
              if "pluto" in low:
                  continue

              # Remove unwanted categories
              blocked = False

              for cat in blocked_categories:

                  if cat in group.lower():

                      blocked = True
                      break

              if blocked:
                  continue

              # Find requested category
              category = None

              for cat in wanted_categories:

                  if cat in group.lower():

                      category = cat
                      break

              if category is None:

                  # Some public entries don't have useful group-title.
                  # Keep only obvious major English entertainment
                  # channels from the six main English-speaking markets.
                  category = "entertainment"

              # --------------------------------------------------------
              # Country extraction
              # --------------------------------------------------------

              country_ok = False

              # tvg-id often ends with .us / .gb / etc.
              m = re.search(
                  r'\.([a-z]{2})(?:@[^"]*)?$',
                  tvg_id.lower()
              )

              if m:

                  if m.group(1) in english_country_codes:
                      country_ok = True

              # Search common country markers
              for code in english_country_codes:

                  if (
                      "." + code
                      in tvg_id.lower()
                  ):

                      country_ok = True
                      break

              # Learning/documentary/science/family can be international.
              if category not in learning_categories:

                  if not country_ok:

                      # Look at explicit country attribute if present.
                      country_match = re.search(
                          r'(?:tvg-country|country)="([^"]*)"',
                          extinf,
                          re.I
                      )

                      if country_match:

                          countries = (
                              country_match
                              .group(1)
                              .lower()
                          )

                          if any(
                              x in countries
                              for x in [
                                  "us",
                                  "gb",
                                  "ca",
                                  "au",
                                  "nz",
                                  "ie"
                              ]
                          ):

                              country_ok = True

                  if not country_ok:
                      continue

              # --------------------------------------------------------
              # Dedupe
              # --------------------------------------------------------

              key = (
                  tvg_id
                  or normalize_name(name)
              )

              if not key:
                  continue

              if key in seen_english:
                  continue

              seen_english.add(key)

              # --------------------------------------------------------
              # Friendly group names
              # --------------------------------------------------------

              if category in {
                  "children",
                  "kids",
                  "animation"
              }:

                  final_group = "English | Kids"

              elif category in {
                  "education",
                  "science"
              }:

                  final_group = "English | Education"

              elif category == "documentary":

                  final_group = "English | Documentary"

              elif category in {
                  "movies",
                  "series"
              }:

                  final_group = "English | Movies & Series"

              elif category == "music":

                  final_group = "English | Music"

              elif category == "sports":

                  final_group = "English | Sports"

              elif category == "family":

                  final_group = "English | Family"

              else:

                  final_group = "English | Entertainment"

              extinf = set_group(
                  extinf,
                  final_group
              )

              result.append(
                  (
                      "English",
                      extinf,
                      options,
                      url
                  )
              )

          # ============================================================
          # ORDER
          # ============================================================

          order = {
              "Japan": 1,
              "Vietnam": 2,
              "English": 3
          }

          result.sort(
              key=lambda x: order.get(x[0], 99)
          )

          # ============================================================
          # COUNTS
          # ============================================================

          japan_count = sum(
              1 for x in result
              if x[0] == "Japan"
          )

          vietnam_count = sum(
              1 for x in result
              if x[0] == "Vietnam"
          )

          english_count = sum(
              1 for x in result
              if x[0] == "English"
          )

          total = len(result)

          print("")
          print("================================")
          print("FINAL PLAYLIST")
          print("================================")
          print("Japan   :", japan_count)
          print("Vietnam :", vietnam_count)
          print("English :", english_count)
          print("TOTAL   :", total)
          print("================================")

          # ============================================================
          # SAFETY CHECK
          #
          # Never replace an existing working playlist if source data
          # suddenly disappears.
          # ============================================================

          if japan_count < 30:
              raise RuntimeError(
                  "Japan count unexpectedly low. "
                  "Existing playlist will be preserved."
              )

          if vietnam_count < 30:
              raise RuntimeError(
                  "Vietnam count unexpectedly low. "
                  "Existing playlist will be preserved."
              )

          if english_count < 50:
              raise RuntimeError(
                  "English count unexpectedly low. "
                  "Existing playlist will be preserved."
              )

          if total < 150:
              raise RuntimeError(
                  "Total playlist unexpectedly low. "
                  "Existing playlist will be preserved."
              )

          # ============================================================
          # WRITE
          # ============================================================

          header = (
              '#EXTM3U '
              'x-tvg-url="'
              'https://iptv-org.github.io/epg/guides/en.xml,'
              'https://iptv-org.github.io/epg/guides/ja.xml,'
              'https://iptv-org.github.io/epg/guides/vi.xml"'
          )

          with open(
              OUTPUT,
              "w",
              encoding="utf-8",
              newline="\n"
          ) as f:

              f.write(header + "\n")

              for source, extinf, options, url in result:

                  f.write(
                      extinf
                      + "\n"
                  )

                  for option in options:

                      f.write(
                          option
                          + "\n"
                      )

                  f.write(
                      url
                      + "\n"
                  )

          print("")
          print("Playlist written successfully.")

          PY

      - name: Verify playlist
        shell: bash
        run: |
          echo "================================"
          echo "VERIFY"
          echo "================================"

          test -s jp-vn.m3u

          COUNT=$(grep -c '^#EXTINF' jp-vn.m3u || true)

          echo "Channels: $COUNT"

          if [ "$COUNT" -lt 150 ]; then
            echo "ERROR: Playlist too small."
            exit 1
          fi

          echo "Playlist verification OK."

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jp-vn.m3u

          if git diff --cached --quiet; then
            echo "No playlist changes."
            exit 0
          fi

          git commit -m "Update stable JP-VN-English IPTV"

          git pull --rebase origin main

          git push origin main
