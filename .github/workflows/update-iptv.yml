          }

          def valid_hls(url):
              if not url or not re.match(r"^https?://", url, re.I):
                  return False

              try:
                  response = session.get(
                      url,
                      headers=VTV_HEADERS,
                      timeout=12,
                      allow_redirects=True,
                  )

                  if response.status_code != 200:
                      return False

                  return "#EXTM3U" in response.text[:200000]

              except Exception:
                  return False

          def extract_m3u8(text):
              text = text.replace("\\/", "/")
              text = text.replace("\\u0026", "&")

              patterns = [
                  r'(?:file|source|src)\s*[:=]\s*["\']([^"\']+?\.m3u8[^"\']*)',
                  r'(https?://[^"\'\s<>]+?\.m3u8[^"\'\s<>]*)',
              ]

              for pattern in patterns:
                  matches = re.findall(
                      pattern,
                      text,
                      flags=re.IGNORECASE,
                  )

                  for url in matches:
                      url = url.replace("\\u0026", "&")

                      if valid_hls(url):
                          return url

              return None

