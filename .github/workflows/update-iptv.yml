name: Update JP-VN IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and merge playlists
        run: |
          python - <<'PY'
          import urllib.request

          sources = [
              ("JAPAN", "https://raw.githubusercontent.com/cherryand1112-creator/IPTV-JP/main/JP_NOVPN.m3u"),
              ("VIETNAM", "https://iptv-org.github.io/iptv/countries/vn.m3u"),
          ]

          playlists = []

          for name, url in sources:
              print(f"Downloading {name}:")
              print(url)

              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  with urllib.request.urlopen(req, timeout=60) as r:
                      data = r.read().decode("utf-8")

                  print(f"{name} OK - {len(data)} bytes")
                  playlists.append(data)

              except Exception as e:
                  print(f"{name} FAILED: {e}")
                  raise

          with open("jp-vn.m3u", "w", encoding="utf-8") as f:
              f.write("#EXTM3U\n")

              for data in playlists:
                  for line in data.splitlines():
                      if line.strip() != "#EXTM3U":
                          f.write(line + "\n")

          print("Playlist created successfully.")

      - name: Commit playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jp-vn.m3u
          git diff --cached --quiet || git commit -m "Update JP-VN IPTV playlist"
          git push
