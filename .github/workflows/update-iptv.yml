name: Update JP-VN IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and merge playlists
        run: |
          python - <<'PY'
          import urllib.request

          jp_url = "https://raw.githubusercontent.com/cherryand1112-creator/IPTV-JP/main/JP.m3u"
          vn_url = "https://iptv-org.github.io/iptv/countries/vn.m3u"

          def download(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read().decode("utf-8")

          jp = download(jp_url)
          vn = download(vn_url)

          def clean(data):
              lines = data.splitlines()
              return "\n".join(
                  line for line in lines
                  if line.strip() != "#EXTM3U"
              )

          with open("jp-vn.m3u", "w", encoding="utf-8") as f:
              f.write("#EXTM3U\n")
              f.write(clean(jp))
              f.write("\n")
              f.write(clean(vn))
              f.write("\n")
          PY

      - name: Commit playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jp-vn.m3u
          git diff --cached --quiet || git commit -m "Update JP-VN IPTV playlist"
          git push
