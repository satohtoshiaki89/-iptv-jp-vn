name: Update IPTV Playlist

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # BUILD PLAYLIST
      # ============================================================

      - name: Build IPTV playlist
        env:
          JAPAN_URL: "https://raw.githubusercontent.com/ZXArkin/my-personal-iptv/iptv-radio/Japan.m3u"
          VIETNAM_URL: "https://raw.githubusercontent.com/ZXArkin/my-personal-iptv/iptv-radio/ZXIPTV.m3u"
          ENGLISH_URL: "https://iptv-org.github.io/iptv/languages/eng.m3u"
          CATEGORY_URL: "https://iptv-org.github.io/iptv/index.category.m3u"
        run: |

          python3 <<'PY'

          import os
          import re
          import urllib.request
          import urllib.error
          from pathlib import Path

          # ========================================================
          # CONFIG
          # ========================================================

          JAPAN_URL = os.environ["JAPAN_URL"]
          VIETNAM_URL = os.environ["VIETNAM_URL"]
          ENGLISH_URL = os.environ["ENGLISH_URL"]
          CATEGORY_URL = os.environ["CATEGORY_URL"]

          OUTPUT = Path("jp-vn.m3u")
          TEMP_OUTPUT = Path("jp-vn.m3u.tmp")

          UA = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/131.0 Safari/537.36"
          )

          # ========================================================
          # DOWNLOAD
          # ========================================================

          def download(url, headers=None, timeout=45):

              h = {
                  "User-Agent": UA,
                  "Accept": "*/*",
              }

              if headers:
                  h.update(headers)

              req = urllib.request.Request(
                  url,
                  headers=h
              )

              with urllib.request.urlopen(
                  req,
                  timeout=timeout
              ) as r:

                  data = r.read()

              return data.decode(
                  "utf-8",
                  errors="replace"
              )


          # ========================================================
          # TEST HLS
          # ========================================================

          def test_hls(url, referer=None):

              try:

                  headers = {
                      "User-Agent": UA,
                      "Accept": "*/*",
                  }

                  if referer:
                      headers["Referer"] = referer

                  req = urllib.request.Request(
                      url,
                      headers=headers
                  )

                  with urllib.request.urlopen(
                      req,
                      timeout=15
                  ) as r:

                      data = r.read(
                          12000
                      ).decode(
                          "utf-8",
                          errors="replace"
                      )

                      status = getattr(
                          r,
                          "status",
                          200
                      )

                  if status == 200 and "#EXTM3U" in data:

                      print(
                          "HLS OK:",
                          url
                      )

                      return True

                  print(
                      "HLS BAD:",
                      status,
                      url
                  )

                  return False

              except Exception as e:

                  print(
                      "HLS ERROR:",
                      url,
                      str(e)
                  )

                  return False


          # ========================================================
          # M3U PARSER
          # ========================================================

          def parse_m3u(text):

              entries = []

              current = None

              for line in text.splitlines():

                  line = line.strip()

                  if not line:
                      continue

                  if line.startswith("#EXTINF"):

                      current = {
                          "info": line,
                          "url": None
                      }

                  elif (
                      current
                      and not line.startswith("#")
                  ):

                      current["url"] = line

                      entries.append(
                          current
                      )

                      current = None

              return entries


          # ========================================================
          # M3U HELPERS
          # ========================================================

          def get_name(entry):

              info = entry["info"]

              if "," in info:
                  return info.split(
                      ",",
                      1
                  )[1].strip()

              return ""


          def get_id(entry):

              m = re.search(
                  r'tvg-id="([^"]*)"',
                  entry["info"],
                  re.I
              )

              return (
                  m.group(1).strip()
                  if m
                  else ""
              )


          def get_group(entry):

              m = re.search(
                  r'group-title="([^"]*)"',
                  entry["info"],
                  re.I
              )

              return (
                  m.group(1).strip()
                  if m
                  else ""
              )


          def set_group(
              entry,
              group
          ):

              info = entry["info"]

              if re.search(
                  r'group-title="[^"]*"',
                  info,
                  re.I
              ):

                  info = re.sub(
                      r'group-title="[^"]*"',
                      f'group-title="{group}"',
                      info,
                      flags=re.I
                  )

              else:

                  info = info.replace(
                      "#EXTINF:-1",
                      f'#EXTINF:-1 group-title="{group}"',
                      1
                  )

              return {
                  "info": info,
                  "url": entry["url"]
              }


          # ========================================================
          # JAPAN
          # ========================================================

          print("")
          print("========================================")
          print("JAPAN")
          print("========================================")

          japan_text = download(
              JAPAN_URL
          )

          japan_entries = parse_m3u(
              japan_text
          )

          japan_result = []

          japan_seen = set()

          for entry in japan_entries:

              name = get_name(
                  entry
              )

              tid = get_id(
                  entry
              )

              key = (
                  tid.lower()
                  or name.lower()
              )

              if not key:
                  continue

              if key in japan_seen:
                  continue

              japan_seen.add(
                  key
              )

              # Keep the source itself intact,
              # only change category.
              entry = set_group(
                  entry,
                  "🇯🇵 Japan"
              )

              japan_result.append(
                  entry
              )

          print(
              "Japan:",
              len(japan_result)
          )


          # ========================================================
          # VIETNAM
          #
          # IMPORTANT:
          # Do NOT filter Vietnam by keywords.
          # Keep the source exactly as supplied.
          # Only remove old VTV entries.
          # ========================================================

          print("")
          print("========================================")
          print("VIETNAM")
          print("========================================")

          vietnam_text = download(
              VIETNAM_URL
          )

          vietnam_entries = parse_m3u(
              vietnam_text
          )


          def is_vtv(entry):

              name = get_name(
                  entry
              ).lower().strip()

              tid = get_id(
                  entry
              ).lower().strip()

              text = (
                  name
                  + " "
                  + tid
              )

              # VTV1 ... VTV9
              if re.match(
                  r"^vtv\s*[1-9]\s*(hd)?$",
                  name
              ):
                  return True

              if re.match(
                  r"^vtv[1-9](hd)?$",
                  tid
              ):
                  return True

              if re.match(
                  r"^vtv[1-9](?:\.vn)?@",
                  tid
              ):
                  return True

              # Special VTV feeds
              special = [
                  "vtv tây nguyên",
                  "vtv tay nguyen",
                  "vtv5 tây nguyên",
                  "vtv5 tay nguyen",
                  "vtv5 tnb",
                  "vtv cần thơ",
                  "vtv can tho",
                  "vtvct",
                  "vtv10",
              ]

              if any(
                  x in text
                  for x in special
              ):
                  return True

              return False


          vietnam_result = []

          for entry in vietnam_entries:

              # ONLY remove VTV.
              # Everything else is preserved.
              if is_vtv(entry):
                  continue

              entry = set_group(
                  entry,
                  "🇻🇳 Vietnam"
              )

              vietnam_result.append(
                  entry
              )


          print(
              "Vietnam non-VTV:",
              len(vietnam_result)
          )


          # ========================================================
          # VTV SOURCES
          #
          # We test each channel.
          #
          # Priority:
          # 1. VTVGo official CDN
          # 2. FPT Play CDN
          #
          # No fake URL.
          # If neither source works, STOP the workflow.
          # ========================================================

          print("")
          print("========================================")
          print("VTV SOURCE TEST")
          print("========================================")


          VTV_SOURCES = {

              "VTV1": [

                  (
                      "https://vtvgolive-failover.vtvdigital.vn/"
                      "vtvgo/vtv1-manifest.m3u8",
                      "https://vtvgo.vn/"
                  ),

                  (
                      "https://live-a.fptplay53.net/"
                      "live/media/vtv1/live247-hls-avc/index.m3u8",
                      "https://fptplay.vn/"
                  ),

              ],


              "VTV2": [

                  (
                      "https://vtvgolive-failover.vtvdigital.vn/"
                      "vtvgo/vtv2-manifest.m3u8",
                      "https://vtvgo.vn/"
                  ),

                  (
                      "https://live-a.fptplay53.net/"
                      "live/media/vtv2/live247-hls-avc/index.m3u8",
                      "https://fptplay.vn/"
                  ),

              ],


              "VTV3": [

                  (
                      "https://vtvgolive-failover.vtvdigital.vn/"
                      "vtvgo/vtv3-manifest.m3u8",
                      "https://vtvgo.vn/"
                  ),

                  (
                      "https://live-a.fptplay53.net/"
                      "live/media/vtv3/live247-hls-avc/index.m3u8",
                      "https://fptplay.vn/"
                  ),

              ],


              "VTV4": [

                  (
                      "https://vtvgolive-failover.vtvdigital.vn/"
                      "vtvgo/vtv4-manifest.m3u8",
                      "https://vtvgo.vn/"
                  ),

                  (
                      "https://live-a.fptplay53.net/"
                      "live/media/vtv4/live247-hls-avc/index.m3u8",
                      "https://fptplay.vn/"
                  ),

              ],


              "VTV5": [

                  (
                      "https://vtvgolive-failover.vtvdigital.vn/"
                      "vtvgo/vtv5-manifest.m3u8",
                      "https://vtvgo.vn/"
                  ),

                  (
                      "https://live-a.fptplay53.net/"
                      "live/media/vtv5/live247-hls-avc/index.m3u8",
                      "https://fptplay.vn/"
                  ),

              ],


              "VTV6": [

                  (
                      "https://vtvgolive-failover.vtvdigital.vn/"
                      "vtvgo/vtv6-manifest.m3u8",
                      "https://vtvgo.vn/"
                  ),

                  (
                      "https://live.fptplay53.net/"
                      "fnxhd1/vtv6hd_vhls.smil/chunklist.m3u8",
                      "https://fptplay.vn/"
                  ),

              ],


              "VTV7": [

                  (
                      "https://vtvgolive-failover.vtvdigital.vn/"
                      "vtvgo/vtv7-manifest.m3u8",
                      "https://vtvgo.vn/"
                  ),

                  (
                      "https://live.fptplay53.net/"
                      "fnxhd1/vtv7hd_vhls.smil/"
                      "chunklist_b5000000.m3u8",
                      "https://fptplay.vn/"
                  ),

              ],


              "VTV8": [

                  (
                      "https://vtvgolive-failover.vtvdigital.vn/"
                      "vtvgo/vtv8-manifest.m3u8",
                      "https://vtvgo.vn/"
                  ),

                  (
                      "https://live.fptplay53.net/"
                      "epzhd1/vtv8hd_vhls.smil/chunklist.m3u8",
                      "https://fptplay.vn/"
                  ),

              ],


              "VTV9": [

                  (
                      "https://vtvgolive-failover.vtvdigital.vn/"
                      "vtvgo/vtv9-manifest.m3u8",
                      "https://vtvgo.vn/"
                  ),

                  (
                      "https://live.fptplay53.net/"
                      "fnxhd1/vtv9hd_vhls.smil/chunklist.m3u8",
                      "https://fptplay.vn/"
                  ),

              ],

          }


          selected_vtv = {}

          for channel, sources in VTV_SOURCES.items():

              print("")
              print(
                  "Testing",
                  channel
              )

              selected = None

              for url, referer in sources:

                  if test_hls(
                      url,
                      referer
                  ):

                      selected = (
                          url,
                          referer
                      )

                      print(
                          "SELECTED:",
                          channel,
                          url
                      )

                      break

              if not selected:

                  raise RuntimeError(
                      f"No working source found for {channel}. "
                      "Playlist will NOT be overwritten."
                  )

              selected_vtv[channel] = selected


          # ========================================================
          # ADD VTV
          # ========================================================

          vtv_result = []

          for channel in [
              "VTV1",
              "VTV2",
              "VTV3",
              "VTV4",
              "VTV5",
              "VTV6",
              "VTV7",
              "VTV8",
              "VTV9",
          ]:

              url, referer = selected_vtv[
                  channel
              ]

              number = channel.replace(
                  "VTV",
                  ""
              )

              info = (
                  '#EXTINF:-1 '
                  f'tvg-id="VTV{number}.vn@HD" '
                  'group-title="🇻🇳 VTV" '
                  f'tvg-name="{channel} HD",'
                  f'{channel} HD'
              )

              vtv_entry = {
                  "info": info,
                  "url": url,
                  "referer": referer
              }

              vtv_result.append(
                  vtv_entry
              )


          print(
              "VTV:",
              len(vtv_result)
          )


          # ========================================================
          # ENGLISH
          # ========================================================

          print("")
          print("========================================")
          print("ENGLISH")
          print("========================================")

          english_text = download(
              ENGLISH_URL
          )

          english_entries = parse_m3u(
              english_text
          )


          print(
              "English source:",
              len(english_entries)
          )


          # Download category database
          category_text = download(
              CATEGORY_URL
          )

          category_entries = parse_m3u(
              category_text
          )


          categories = {}

          for entry in category_entries:

              tid = get_id(
                  entry
              ).lower()

              if not tid:
                  continue

              categories[
                  tid
              ] = (
                  get_group(entry)
                  + " "
                  + get_name(entry)
                  + " "
                  + entry["info"]
              ).lower()


          # ========================================================
          # ENGLISH CATEGORIES WANTED
          # ========================================================

          wanted_categories = [

              "kids",
              "children",
              "animation",
              "family",

              "education",
              "educational",

              "science",

              "documentary",
              "documentaries",

              "movie",
              "movies",
              "film",

              "series",

              "entertainment",

              "music",

              "sports",
              "sport",

              "news",

              "general",

              "lifestyle",

              "culture",

              "travel",

          ]


          blocked = [

              "adult",
              "xxx",
              "porn",

              "casino",
              "gambling",

              "shopping",

              "religion",
              "religious",

              "weather",

              "business",
              "stock",

              "legislative",
              "parliament",

              "court",

              "pluto",

          ]


          # Major English-speaking markets
          english_country_codes = {

              "us",
              "gb",
              "uk",
              "ca",
              "au",
              "nz",
              "ie",

          }


          def has_country(
              text
          ):

              text = text.lower()

              for code in english_country_codes:

                  patterns = [

                      f".{code}",
                      f"@{code}",
                      f"_{code}",
                      f"-{code}",
                      f"({code})",
                      f" {code} ",

                  ]

                  if any(
                      p in text
                      for p in patterns
                  ):

                      return True

              return False


          # Major international English brands.
          global_brands = [

              "bbc",
              "bbc news",
              "bbc earth",

              "sky news",
              "sky cinema",
              "sky arts",
              "sky max",

              "itv",
              "channel 4",
              "channel 5",

              "abc",
              "cbs",
              "nbc",
              "fox",
              "pbs",

              "cnn",
              "cnbc",
              "msnbc",

              "national geographic",
              "nat geo",

              "discovery",
              "animal planet",
              "history",

              "smithsonian",

              "nickelodeon",
              "nick jr",
              "cartoon network",
              "cartoonito",
              "boomerang",

              "disney",

              "mtv",
              "vh1",

              "espn",
              "wwe",
              "eurosport",
              "tennis channel",

              "travel channel",
              "food network",

          ]


          english_result = []

          for entry in english_entries:

              tid = get_id(
                  entry
              ).lower()

              name = get_name(
                  entry
              ).lower()

              info = entry[
                  "info"
              ].lower()

              url = entry[
                  "url"
              ].lower()

              full = (
                  tid
                  + " "
                  + name
                  + " "
                  + info
                  + " "
                  + url
              )

              # Remove Pluto and blocked categories
              if any(
                  x in full
                  for x in blocked
              ):
                  continue

              category = categories.get(
                  tid,
                  ""
              )

              combined = (
                  full
                  + " "
                  + category
              )

              # Must belong to wanted category
              if not any(
                  x in combined
                  for x in wanted_categories
              ):
                  continue

              # English-speaking country
              # OR recognized international English brand.
              if not has_country(
                  combined
              ):

                  if not any(
                      brand in combined
                      for brand in global_brands
                  ):

                      continue

              entry = set_group(
                  entry,
                  "🇬🇧 English"
              )

              english_result.append(
                  entry
              )


          # ========================================================
          # DEDUP ENGLISH
          # ========================================================

          english_seen = {}

          for entry in english_result:

              key = (
                  get_id(entry).lower()
                  or get_name(entry).lower()
              )

              if not key:
                  continue

              if key not in english_seen:

                  english_seen[
                      key
                  ] = entry

              else:

                  old = english_seen[
                      key
                  ]

                  old_info = old[
                      "info"
                  ].lower()

                  new_info = entry[
                      "info"
                  ].lower()

                  old_hd = (
                      " hd" in old_info
                      or "1080" in old_info
                      or "720" in old_info
                  )

                  new_hd = (
                      " hd" in new_info
                      or "1080" in new_info
                      or "720" in new_info
                  )

                  if (
                      new_hd
                      and not old_hd
                  ):

                      english_seen[
                          key
                      ] = entry


          english_result = list(
              english_seen.values()
          )


          print(
              "English:",
              len(english_result)
          )


          # ========================================================
          # FINAL COUNTS
          # ========================================================

          total = (
              len(japan_result)
              + len(vietnam_result)
              + len(vtv_result)
              + len(english_result)
          )


          print("")
          print("========================================")
          print("FINAL PLAYLIST")
          print("========================================")
          print(
              "Japan       :",
              len(japan_result)
          )
          print(
              "Vietnam     :",
              len(vietnam_result)
          )
          print(
              "VTV         :",
              len(vtv_result)
          )
          print(
              "English     :",
              len(english_result)
          )
          print(
              "TOTAL       :",
              total
          )
          print("========================================")


          # ========================================================
          # SAFETY CHECK
          # ========================================================

          if len(japan_result) < 30:

              raise RuntimeError(
                  "Japan source unexpectedly small."
              )


          if len(vietnam_result) < 70:

              raise RuntimeError(
                  "Vietnam source unexpectedly small."
              )


          if len(vtv_result) != 9:

              raise RuntimeError(
                  "Not all 9 VTV channels have working sources."
              )


          if len(english_result) < 500:

              raise RuntimeError(
                  "English source unexpectedly small."
              )


          if total < 800:

              raise RuntimeError(
                  "Final playlist unexpectedly small."
              )


          # ========================================================
          # WRITE TEMPORARY PLAYLIST
          # ========================================================

          output = [

              "#EXTM3U",

              "# ========================================",
              "# 🇯🇵 JAPAN",
              "# ========================================",

          ]


          # Japan
          for entry in japan_result:

              output.append(
                  entry["info"]
              )

              output.append(
                  entry["url"]
              )


          output.extend([

              "",
              "# ========================================",
              "# 🇻🇳 VIETNAM",
              "# ========================================",

          ])


          # Vietnam
          for entry in vietnam_result:

              output.append(
                  entry["info"]
              )

              output.append(
                  entry["url"]
              )


          output.extend([

              "",
              "# ========================================",
              "# 🇻🇳 VTV",
              "# ========================================",

          ])


          # VTV
          for entry in vtv_result:

              output.append(
                  entry["info"]
              )

              # APTV may ignore EXTVLCOPT,
              # but it is harmless for players that support it.
              output.append(
                  "#EXTVLCOPT:http-referrer="
                  + entry["referer"]
              )

              output.append(
                  entry["url"]
              )


          output.extend([

              "",
              "# ========================================",
              "# 🇬🇧 ENGLISH",
              "# ========================================",

          ])


          # English
          for entry in english_result:

              output.append(
                  entry["info"]
              )

              output.append(
                  entry["url"]
              )


          TEMP_OUTPUT.write_text(
              "\n".join(output)
              + "\n",
              encoding="utf-8"
          )


          # ========================================================
          # FINAL FILE VALIDATION
          # ========================================================

          content = TEMP_OUTPUT.read_text(
              encoding="utf-8"
          )

          count = content.count(
              "#EXTINF"
          )


          if count < 800:

              raise RuntimeError(
                  "Generated playlist validation failed."
              )


          # Only now replace the real playlist.
          TEMP_OUTPUT.replace(
              OUTPUT
          )


          print("")
          print(
              "SUCCESS:",
              OUTPUT
          )

          print(
              "Channels:",
              count
          )

          PY


      # ============================================================
      # VERIFY
      # ============================================================

      - name: Verify playlist
        run: |

          test -s jp-vn.m3u

          COUNT=$(grep -c '^#EXTINF' jp-vn.m3u || true)

          echo "Final channel count: $COUNT"

          if [ "$COUNT" -lt 800 ]; then
            echo "ERROR: Playlist too small."
            exit 1
          fi

          echo "Playlist verification OK."


      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit and push
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add jp-vn.m3u

          if git diff --cached --quiet; then

            echo "No playlist changes."

          else

            git commit \
              -m "Update Japan Vietnam VTV English IPTV"

            git push

          fi
