name: Update JP-VN-English IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and build playlist
        shell: bash
        run: |
          python3 <<'PY'
          import urllib.request
          import re

          SOURCES = {
              "Japan": "https://raw.githubusercontent.com/cherryand1112-creator/IPTV-JP/main/JP.m3u",
              "Vietnam": "https://iptv-org.github.io/iptv/countries/vn.m3u",
              "English": "https://iptv-org.github.io/iptv/languages/eng.m3u"
          }

          OUTPUT = "jp-vn.m3u"

          def download(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read().decode("utf-8", errors="replace")

          def parse_m3u(text):
              lines = text.splitlines()
              entries = []

              current = None

              for line in lines:
                  line = line.strip()

                  if not line:
                      continue

                  if line.startswith("#EXTINF:"):
                      current = line
                      continue

                  if line.startswith("#"):
                      continue

                  if current and (
                      line.startswith("http://")
                      or line.startswith("https://")
                  ):
                      entries.append((current, line))
                      current = None

              return entries

          # ------------------------------------------------------------
          # FILTER ENGLISH
          # ------------------------------------------------------------

          ALLOWED_GROUPS = {
              "Animation",
              "Children",
              "Kids",
              "Education",
              "Entertainment",
              "Family",
              "Movies",
              "Music",
              "Science",
              "Series",
              "Sports",
              "Documentary"
          }

          BLOCKED_GROUPS = {
              "Adult",
              "Religious",
              "Shopping",
              "Weather",
              "Business",
              "Legislative"
          }

          def english_allowed(extinf):
              lower = extinf.lower()

              # Remove unwanted categories
              for group in BLOCKED_GROUPS:
                  if f'group-title="{group.lower()}"' in lower:
                      return False

              # Find group title
              m = re.search(
                  r'group-title="([^"]+)"',
                  extinf,
                  re.I
              )

              if not m:
                  # If there is no group-title, keep it only when
                  # the entry clearly belongs to English TV.
                  return True

              group = m.group(1).strip().lower()

              allowed = {
                  x.lower()
                  for x in ALLOWED_GROUPS
              }

              return group in allowed

          # ------------------------------------------------------------
          # BUILD
          # ------------------------------------------------------------

          all_entries = []

          # Keep duplicate control separately for each source.
          seen_japan = set()
          seen_vietnam = set()
          seen_english = set()

          # ------------------------------------------------------------
          # JAPAN
          # Direct source that worked yesterday
          # ------------------------------------------------------------

          print("Downloading Japan...")

          jp_entries = parse_m3u(
              download(SOURCES["Japan"])
          )

          for extinf, url in jp_entries:

              key = extinf + "\n" + url

              if key in seen_japan:
                  continue

              seen_japan.add(key)

              # Force group
              extinf = re.sub(
                  r'group-title="[^"]*"',
                  'group-title="Japan"',
                  extinf,
                  count=1,
                  flags=re.I
              )

              if 'group-title=' not in extinf.lower():
                  extinf = extinf.replace(
                      "#EXTINF:-1",
                      '#EXTINF:-1 group-title="Japan"',
                      1
                  )

              all_entries.append(
                  ("Japan", extinf, url)
              )

          # ------------------------------------------------------------
          # VIETNAM
          # Direct public country playlist
          # ------------------------------------------------------------

          print("Downloading Vietnam...")

          vn_entries = parse_m3u(
              download(SOURCES["Vietnam"])
          )

          for extinf, url in vn_entries:

              key = extinf + "\n" + url

              if key in seen_vietnam:
                  continue

              seen_vietnam.add(key)

              extinf = re.sub(
                  r'group-title="[^"]*"',
                  'group-title="Vietnam"',
                  extinf,
                  count=1,
                  flags=re.I
              )

              if 'group-title=' not in extinf.lower():
                  extinf = extinf.replace(
                      "#EXTINF:-1",
                      '#EXTINF:-1 group-title="Vietnam"',
                      1
                  )

              all_entries.append(
                  ("Vietnam", extinf, url)
              )

          # ------------------------------------------------------------
          # ENGLISH
          # Use public language playlist directly.
          # Do NOT select individual streams through streams.json.
          # ------------------------------------------------------------

          print("Downloading English...")

          en_entries = parse_m3u(
              download(SOURCES["English"])
          )

          for extinf, url in en_entries:

              if not english_allowed(extinf):
                  continue

              key = extinf + "\n" + url

              if key in seen_english:
                  continue

              seen_english.add(key)

              # Keep original group-title where available.
              # If missing, place into English | Entertainment.
              m = re.search(
                  r'group-title="([^"]+)"',
                  extinf,
                  re.I
              )

              if m:
                  original_group = m.group(1).strip()

                  extinf = re.sub(
                      r'group-title="[^"]*"',
                      'group-title="English | '
                      + original_group
                      + '"',
                      extinf,
                      count=1,
                      flags=re.I
                  )

              else:
                  extinf = extinf.replace(
                      "#EXTINF:-1",
                      '#EXTINF:-1 group-title="English | Entertainment"',
                      1
                  )

              all_entries.append(
                  ("English", extinf, url)
              )

          # ------------------------------------------------------------
          # WRITE
          # ------------------------------------------------------------

          header = (
              '#EXTM3U '
              'x-tvg-url="'
              'https://iptv-org.github.io/epg/guides/en.xml,'
              'https://iptv-org.github.io/epg/guides/ja.xml,'
              'https://iptv-org.github.io/epg/guides/vi.xml"'
          )

          with open(
              OUTPUT,
              "w",
              encoding="utf-8",
              newline="\n"
          ) as f:

              f.write(header + "\n")

              for _, extinf, url in all_entries:
                  f.write(extinf + "\n")
                  f.write(url + "\n")

          japan = sum(
              1 for x in all_entries
              if x[0] == "Japan"
          )

          vietnam = sum(
              1 for x in all_entries
              if x[0] == "Vietnam"
          )

          english = sum(
              1 for x in all_entries
              if x[0] == "English"
          )

          total = len(all_entries)

          print("")
          print("==============================")
          print("PLAYLIST CREATED")
          print("==============================")
          print("Japan   :", japan)
          print("Vietnam :", vietnam)
          print("English :", english)
          print("TOTAL   :", total)
          print("==============================")

          if total < 50:
              raise RuntimeError(
                  "Playlist too small. Existing playlist will not be replaced."
              )

          PY

      - name: Verify playlist
        shell: bash
        run: |
          echo "Checking playlist..."

          if [ ! -s jp-vn.m3u ]; then
            echo "ERROR: jp-vn.m3u is empty."
            exit 1
          fi

          COUNT=$(grep -c '^#EXTINF' jp-vn.m3u || true)

          echo "Total channels: $COUNT"

          if [ "$COUNT" -lt 50 ]; then
            echo "ERROR: Too few channels."
            exit 1
          fi

          echo "Playlist verification OK."

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jp-vn.m3u

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update IPTV playlist"

          git pull --rebase origin main

          git push origin main
              used_keys.add(dedupe_key)

              attrs = []

              if tvg_id:
                  attrs.append(
                      f'tvg-id="{tvg_id}"'
                  )

              if logo:
                  attrs.append(
                      f'tvg-logo="{logo}"'
                  )

              attrs.append(
                  f'group-title="{group}"'
              )

              extinf = (
                  '#EXTINF:-1 '
                  + " ".join(attrs)
                  + ","
                  + name
              )

              lines = [extinf]

              if referrer:
                  lines.append(
                      "#EXTVLCOPT:http-referrer="
                      + str(referrer)
                  )

              if user_agent:
                  lines.append(
                      "#EXTVLCOPT:http-user-agent="
                      + str(user_agent)
                  )

              lines.append(url)

              output_entries.append(
                  "\n".join(lines)
              )

              counts[country_group] += 1

          # ============================================================
          # JAPAN
          # ============================================================
          # Use streams/jp.m3u because the public country playlist
          # contains fewer channels.
          # Deduplicate by tvg-id/name.
          # Prefer first valid occurrence in repository order.
          # ============================================================

          print("Building Japan...")

          try:
              jp_text = download(JAPAN_STREAMS_URL)

              lines = jp_text.splitlines()

              current_info = None
              current_referrer = None
              current_ua = None

              for raw in lines:
                  line = raw.strip()

                  if not line:
                      continue

                  if line.startswith("#EXTINF:"):
                      current_info = line
                      current_referrer = None
                      current_ua = None
                      continue

                  if line.startswith("#EXTVLCOPT:http-referrer="):
                      current_referrer = line.split("=", 1)[1]
                      continue

                  if line.startswith("#EXTVLCOPT:http-user-agent="):
                      current_ua = line.split("=", 1)[1]
                      continue

                  if line.startswith("#"):
                      continue

                  if not current_info:
                      continue

                  url = line

                  if not (
                      url.startswith("http://")
                      or url.startswith("https://")
                  ):
                      current_info = None
                      continue

                  # Get tvg-id
                  m_id = re.search(
                      r'tvg-id="([^"]*)"',
                      current_info
                  )

                  tvg_id = (
                      m_id.group(1).strip()
                      if m_id
                      else ""
                  )

                  # Name after final comma
                  if "," in current_info:
                      name = current_info.split(",", 1)[1].strip()
                  else:
                      name = tvg_id or "Japan TV"

                  # Try matching metadata/logo
                  base_id = tvg_id

                  if "@" in base_id:
                      base_id = base_id.split("@", 1)[0]

                  logo = (
                      logo_map.get(tvg_id)
                      or logo_map.get(base_id)
                      or ""
                  )

                  add_entry(
                      name=name,
                      url=url,
                      group="Japan",
                      country_group="Japan",
                      tvg_id=tvg_id,
                      logo=logo,
                      referrer=current_referrer,
                      user_agent=current_ua
                  )

                  current_info = None
                  current_referrer = None
                  current_ua = None

          except Exception as e:
              print("Japan internal playlist warning:", e)

          # ------------------------------------------------------------
          # JAPAN FALLBACK
          # If internal playlist ever fails, use API data.
          # ------------------------------------------------------------

          if counts["Japan"] == 0:
              print("Japan fallback to API...")

              for cid, c in channel_by_id.items():

                  if (c.get("country") or "").upper() != "JP":
                      continue

                  s = best_stream.get(cid)

                  if not s:
                      continue

                  add_entry(
                      name=c.get("name") or s.get("title") or cid,
                      url=s.get("url"),
                      group="Japan",
                      country_group="Japan",
                      tvg_id=cid,
                      logo=logo_map.get(cid, ""),
                      referrer=s.get("referrer"),
                      user_agent=s.get("user_agent")
                  )

          # ============================================================
          # VIETNAM
          # ============================================================
          # Include Vietnamese-language channels.
          # Do not restrict sports/music/etc.
          # ============================================================

          print("Building Vietnam...")

          for cid, c in channel_by_id.items():

              languages = channel_languages.get(cid, set())

              country = (
                  c.get("country")
                  or ""
              ).upper()

              is_vietnamese = (
                  "vie" in languages
                  or country == "VN"
              )

              if not is_vietnamese:
                  continue

              if c.get("is_nsfw"):
                  continue

              s = best_stream.get(cid)

              if not s:
                  continue

              add_entry(
                  name=c.get("name") or s.get("title") or cid,
                  url=s.get("url"),
                  group="Vietnam",
                  country_group="Vietnam",
                  tvg_id=cid,
                  logo=logo_map.get(cid, ""),
                  referrer=s.get("referrer"),
                  user_agent=s.get("user_agent")
              )

          # ============================================================
          # ENGLISH
          # ============================================================

          print("Building English...")

          def english_group(categories):
              cats = set(categories)

              if cats & {"animation", "children", "kids"}:
                  return "English | Kids"

              if "education" in cats or "science" in cats:
                  return "English | Education"

              if "documentary" in cats:
                  return "English | Documentary"

              if cats & {"movies", "series"}:
                  return "English | Movies & Series"

              if "music" in cats:
                  return "English | Music"

              if "sports" in cats:
                  return "English | Sports"

              if "family" in cats:
                  return "English | Family"

              return "English | Entertainment"

          for cid, c in channel_by_id.items():

              languages = channel_languages.get(cid, set())

              if "eng" not in languages:
                  continue

              if c.get("is_nsfw"):
                  continue

              categories = {
                  str(x).lower()
                  for x in (c.get("categories") or [])
              }

              if categories & BLOCKED_CATEGORIES:
                  continue

              allowed = categories & ENGLISH_CATEGORIES

              if not allowed:
                  continue

              country = (
                  c.get("country")
                  or ""
              ).upper()

              # Entertainment/movies/music/sports/series:
              # restrict mainly to major English-speaking countries.
              #
              # Learning/kids/science/documentary/family:
              # allow English channels internationally.
              if not (categories & LEARNING_CATEGORIES):
                  if country not in ENGLISH_COUNTRIES:
                      continue

              s = best_stream.get(cid)

              if not s:
                  continue

              group = english_group(categories)

              add_entry(
                  name=c.get("name") or s.get("title") or cid,
                  url=s.get("url"),
                  group=group,
                  country_group="English",
                  tvg_id=cid,
                  logo=logo_map.get(cid, ""),
                  referrer=s.get("referrer"),
                  user_agent=s.get("user_agent")
              )

          # ============================================================
          # WRITE PLAYLIST
          # ============================================================

          header = (
              '#EXTM3U '
              'x-tvg-url="https://iptv-org.github.io/epg/guides/en.xml,'
              'https://iptv-org.github.io/epg/guides/ja.xml,'
              'https://iptv-org.github.io/epg/guides/vi.xml"'
          )

          with open(
              OUTPUT,
              "w",
              encoding="utf-8",
              newline="\n"
          ) as f:

              f.write(header + "\n")

              for entry in output_entries:
                  f.write(entry + "\n")

          print("")
          print("==============================")
          print("PLAYLIST CREATED")
          print("==============================")
          print("Japan   :", counts["Japan"])
          print("Vietnam :", counts["Vietnam"])
          print("English :", counts["English"])
          print("TOTAL   :", sum(counts.values()))
          print("==============================")

          if sum(counts.values()) < 50:
              raise RuntimeError(
                  "Playlist unexpectedly too small. "
                  "Stopping to protect existing playlist."
              )

          PY

      - name: Verify playlist
        shell: bash
        run: |
          echo "Checking jp-vn.m3u..."

          if [ ! -s jp-vn.m3u ]; then
            echo "ERROR: jp-vn.m3u is empty."
            exit 1
          fi

          CHANNELS=$(grep -c '^#EXTINF' jp-vn.m3u || true)

          echo "Channels in playlist: $CHANNELS"

          if [ "$CHANNELS" -lt 50 ]; then
            echo "ERROR: Playlist contains too few channels."
            exit 1
          fi

          echo "Playlist OK."

      - name: Commit updated playlist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jp-vn.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update JP-VN IPTV playlist"

          git pull --rebase origin main

          git push origin main
