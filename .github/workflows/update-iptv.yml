name: Update JP-VN IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and merge playlists
        run: |
          python - <<'PY'
          import urllib.request

          sources = [
              ("JAPAN", "https://iptv-org.github.io/iptv/countries/jp.m3u"),
              ("VIETNAM", "https://iptv-org.github.io/iptv/countries/vn.m3u"),
              ("MOVIES", "https://iptv-org.github.io/iptv/categories/movies.m3u"),
              ("SERIES", "https://iptv-org.github.io/iptv/categories/series.m3u"),
              ("ENTERTAINMENT", "https://iptv-org.github.io/iptv/categories/entertainment.m3u"),
              ("KIDS", "https://iptv-org.github.io/iptv/categories/kids.m3u"),
              ("MUSIC", "https://iptv-org.github.io/iptv/categories/music.m3u"),
              ("DOCUMENTARY", "https://iptv-org.github.io/iptv/categories/documentary.m3u"),
              ("NEWS", "https://iptv-org.github.io/iptv/categories/news.m3u"),
              ("SPORTS", "https://iptv-org.github.io/iptv/categories/sports.m3u"),
          ]

          allowed_keywords = [
              "Pluto TV",
              "Classic Movies",
              "Crime Movies",
              "Crime Drama",
              "Drama",
              "Thrillers",
              "Horror",
              "Cult Films",
              "Spotlight",
              "Action",
              "PBS Kids",
              "HappyKids",
              "BBC Kids",
              "Kids Series",
              "TVOKids",
              "NASA",
              "Documentary",
              "Forensic Files",
              "Law & Crime",
              "Nature",
              "Vevo",
              "Music",
              "NickMusic",
              "BBC News",
              "DW",
              "France 24",
              "Al Jazeera",
              "Euronews",
              "NHK WORLD",
              "Red Bull",
              "World Poker Tour",
          ]

          playlists = []

          for name, url in sources:
              print(f"Downloading {name}:")
              print(url)

              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  with urllib.request.urlopen(request, timeout=60) as response:
                      data = response.read().decode("utf-8", errors="ignore")

                  print(f"{name} OK - {len(data)} bytes")
                  playlists.append((name, data))

              except Exception as error:
                  print(f"{name} FAILED: {error}")

          output = ["#EXTM3U"]
          seen_urls = set()

          for source_name, data in playlists:
              lines = data.splitlines()
              i = 0

              while i < len(lines):
                  if lines[i].startswith("#EXTINF") and i + 1 < len(lines):
                      info = lines[i]
                      url = lines[i + 1].strip()

                      if source_name in ["JAPAN", "VIETNAM"]:
                          matched = True
                      else:
                          channel_name = info.split(",")[-1].strip()

                          matched = any(
                              keyword.lower() in channel_name.lower()
                              for keyword in allowed_keywords
                          )

                      if matched and url and url not in seen_urls:
                          output.append(info)
                          output.append(url)
                          seen_urls.add(url)

                      i += 2
                  else:
                      i += 1

          with open("jp-vn.m3u", "w", encoding="utf-8") as file:
              file.write("\n".join(output))
              file.write("\n")

          print("================================")
          print("Playlist created successfully.")
          print(f"Total streams: {len(seen_urls)}")
          print("================================")
          PY

      - name: Commit playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jp-vn.m3u
          git diff --cached --quiet || git commit -m "Update JP-VN IPTV playlist"
          git push
