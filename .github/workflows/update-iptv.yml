name: Stable JP-VN-English IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ==============================================================
      # CHECKOUT
      # ==============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==============================================================
      # BUILD PLAYLIST
      # ==============================================================

      - name: Build stable playlist
        shell: bash
        run: |

          python3 <<'PY'

          import urllib.request
          import re
          import sys


          OUTPUT = "jp-vn.m3u"


          # ============================================================
          # SOURCE 1
          # JAPAN
          #
          # This is the actual Japan.m3u currently present in
          # ZXArkin/my-personal-iptv on branch iptv-radio.
          # ==============================================================

          JAPAN_URL = (
              "https://raw.githubusercontent.com/"
              "ZXArkin/my-personal-iptv/"
              "iptv-radio/Japan.m3u"
          )


          # ============================================================
          # SOURCE 2
          # VIETNAM
          #
          # This is the actual ZXIPTV.m3u currently present in the
          # same repository / branch.
          # ==============================================================

          VIETNAM_URL = (
              "https://raw.githubusercontent.com/"
              "ZXArkin/my-personal-iptv/"
              "iptv-radio/ZXIPTV.m3u"
          )


          # ============================================================
          # SOURCE 3
          # ENGLISH LANGUAGE
          #
          # We use the public English playlist only to identify English
          # channels.
          # ==============================================================

          ENGLISH_URL = (
              "https://iptv-org.github.io/"
              "iptv/languages/eng.m3u"
          )


          # ============================================================
          # SOURCE 4
          # ENGLISH CATEGORIES
          #
          # Public category playlist.
          # We intersect it with English-language channels.
          # ==============================================================

          CATEGORY_URL = (
              "https://iptv-org.github.io/"
              "iptv/index.category.m3u"
          )


          # ============================================================
          # HTTP DOWNLOAD
          # ==============================================================

          def download(url):

              print("")
              print("Downloading:")
              print(url)

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=90
                  ) as response:

                      data = response.read()

              except Exception as error:

                  print("DOWNLOAD ERROR:")
                  print(error)

                  raise


              if not data:

                  raise RuntimeError(
                      "Downloaded file is empty."
                  )


              return data.decode(
                  "utf-8",
                  errors="replace"
              )


          # ============================================================
          # M3U PARSER
          # ==============================================================

          def parse_m3u(text):

              lines = text.splitlines()

              entries = []

              current_extinf = None
              current_options = []

              for raw in lines:

                  line = raw.strip()

                  if not line:
                      continue


                  if line.startswith("#EXTINF:"):

                      current_extinf = line
                      current_options = []

                      continue


                  if line.startswith("#EXTVLCOPT:"):

                      current_options.append(line)

                      continue


                  if line.startswith("#"):

                      continue


                  if (
                      current_extinf
                      and (
                          line.startswith("http://")
                          or line.startswith("https://")
                      )
                  ):

                      entries.append(
                          (
                              current_extinf,
                              current_options[:],
                              line
                          )
                      )

                      current_extinf = None
                      current_options = []


              return entries


          # ============================================================
          # GET M3U ATTRIBUTE
          # ==============================================================

          def get_attr(extinf, attr):

              pattern = (
                  r'\b'
                  + re.escape(attr)
                  + r'="([^"]*)"'
              )

              match = re.search(
                  pattern,
                  extinf,
                  re.I
              )

              if match:

                  return match.group(1).strip()


              return ""


          # ============================================================
          # GET CHANNEL NAME
          # ==============================================================

          def get_name(extinf):

              if "," in extinf:

                  return (
                      extinf.split(",", 1)[1]
                      .strip()
                  )

              return ""


          # ============================================================
          # SET GROUP
          # ==============================================================

          def set_group(extinf, group):

              if re.search(
                  r'group-title="[^"]*"',
                  extinf,
                  re.I
              ):

                  return re.sub(
                      r'group-title="[^"]*"',
                      'group-title="' + group + '"',
                      extinf,
                      count=1,
                      flags=re.I
                  )


              return extinf.replace(
                  "#EXTINF:-1",
                  '#EXTINF:-1 group-title="' + group + '"',
                  1
              )


          # ============================================================
          # NORMALIZE NAME
          # ==============================================================

          def normalize_name(name):

              name = re.sub(
                  r'\s*\([^)]*p\)',
                  "",
                  name,
                  flags=re.I
              )

              name = re.sub(
                  r'\s+',
                  " ",
                  name
              )

              return name.strip().lower()


          # ============================================================
          # DOWNLOAD ALL SOURCES
          # ==============================================================

          print("")
          print("======================================")
          print("DOWNLOADING IPTV SOURCES")
          print("======================================")


          japan_text = download(JAPAN_URL)

          vietnam_text = download(VIETNAM_URL)

          english_text = download(ENGLISH_URL)

          category_text = download(CATEGORY_URL)


          # ============================================================
          # PARSE
          # ==============================================================

          japan_entries = parse_m3u(japan_text)

          vietnam_entries = parse_m3u(vietnam_text)

          english_entries = parse_m3u(english_text)

          category_entries = parse_m3u(category_text)


          print("")
          print("RAW JAPAN   :", len(japan_entries))
          print("RAW VIETNAM :", len(vietnam_entries))
          print("RAW ENGLISH :", len(english_entries))
          print("RAW CATEGORY:", len(category_entries))


          # ============================================================
          # RESULT
          # ==============================================================

          result = []


          # ============================================================
          # JAPAN
          #
          # Keep the source URLs exactly as supplied by the source.
          #
          # Remove obvious duplicate copies of the same channel.
          # Prefer HD over SD when the source provides both.
          # ==============================================================

          japan_channels = {}


          for extinf, options, url in japan_entries:

              name = get_name(extinf)

              tvg_id = get_attr(
                  extinf,
                  "tvg-id"
              )


              key = (
                  tvg_id.lower()
                  if tvg_id
                  else normalize_name(name)
              )


              if not key:
                  continue


              # Determine whether this looks like an HD version.

              hd = False

              lower_name = name.lower()

              if (
                  " hd" in lower_name
                  or "4k" in lower_name
                  or "1080" in lower_name
                  or "720" in lower_name
              ):

                  hd = True


              if key not in japan_channels:

                  japan_channels[key] = (
                      extinf,
                      options,
                      url,
                      hd
                  )

              else:

                  old = japan_channels[key]

                  # Prefer HD version.

                  if hd and not old[3]:

                      japan_channels[key] = (
                          extinf,
                          options,
                          url,
                          hd
                      )


          for extinf, options, url, _ in japan_channels.values():

              extinf = set_group(
                  extinf,
                  "Japan"
              )

              result.append(
                  (
                      "Japan",
                      extinf,
                      options,
                      url
                  )
              )


          # ============================================================
          # VIETNAM
          #
          # ZXIPTV already contains Vietnamese TV.
          #
          # Keep TV channels, including:
          # VTV
          # HTV
          # VTC
          # THVL
          # Local stations
          # Sports
          # Music
          # News
          # Entertainment
          #
          # Remove obvious radio-only entries.
          # ==============================================================

          vietnam_channels = {}


          for extinf, options, url in vietnam_entries:

              name = get_name(extinf)

              tvg_id = get_attr(
                  extinf,
                  "tvg-id"
              )

              group = get_attr(
                  extinf,
                  "group-title"
              )


              combined = (
                  name
                  + " "
                  + tvg_id
                  + " "
                  + group
              ).lower()


              # --------------------------------------------------------
              # Remove radio / audio
              # --------------------------------------------------------

              radio_words = [
                  "radio",
                  "fm ",
                  " am ",
                  "podcast",
                  "audio only"
              ]


              if any(
                  word in combined
                  for word in radio_words
              ):

                  continue


              # --------------------------------------------------------
              # Identify Vietnam
              # --------------------------------------------------------

              vietnam = False


              if ".vn" in tvg_id.lower():

                  vietnam = True


              if (
                  "vietnam" in combined
                  or "việt nam" in combined
              ):

                  vietnam = True


              vietnam_keywords = [

                  "vtv",
                  "htv",
                  "htvc",
                  "vtc",
                  "thvl",

                  "hanoi",
                  "hà nội",

                  "ho chi minh",
                  "hcm",
                  "tphcm",

                  "da nang",
                  "đà nẵng",

                  "hai phong",
                  "hải phòng",

                  "can tho",
                  "cần thơ",

                  "binh duong",
                  "bình dương",

                  "dong nai",
                  "đồng nai",

                  "quang ninh",
                  "quảng ninh",

                  "khanh hoa",
                  "khánh hòa",

                  "hue",
                  "huế",

                  "nghe an",
                  "nghệ an",

                  "ha tinh",
                  "hà tĩnh",

                  "quang binh",
                  "quảng bình",

                  "quang tri",
                  "quảng trị",

                  "quang nam",
                  "quảng nam",

                  "quang ngai",
                  "quảng ngãi",

                  "binh dinh",
                  "bình định",

                  "phu yen",
                  "phú yên",

                  "gia lai",

                  "kon tum",

                  "dak lak",
                  "đắk lắk",

                  "dak nong",
                  "đắk nông",

                  "lam dong",
                  "lâm đồng",

                  "tay ninh",
                  "tây ninh",

                  "vinh long",
                  "vĩnh long",

                  "dong thap",
                  "đồng tháp",

                  "tien giang",
                  "tiền giang",

                  "ben tre",
                  "bến tre",

                  "tra vinh",
                  "trà vinh",

                  "soc trang",
                  "sóc trăng",

                  "bac lieu",
                  "bạc liêu",

                  "ca mau",
                  "cà mau",

                  "kien giang",
                  "kiên giang",

                  "an giang",

                  "long an",

                  "binh phuoc",
                  "bình phước",

                  "binh thuan",
                  "bình thuận",

                  "ninh thuan",
                  "ninh thuận",

                  "phu tho",
                  "phú thọ",

                  "thai nguyen",
                  "thái nguyên",

                  "bac ninh",
                  "bắc ninh",

                  "bac giang",
                  "bắc giang",

                  "hai duong",
                  "hải dương",

                  "hung yen",
                  "hưng yên",

                  "nam dinh",
                  "nam định",

                  "ninh binh",
                  "ninh bình",

                  "thai binh",
                  "thái bình",

                  "thanh hoa",
                  "thanh hóa",

                  "lao cai",
                  "lào cai",

                  "yen bai",
                  "yên bái",

                  "son la",
                  "sơn la",

                  "dien bien",
                  "điện biên",

                  "lai chau",
                  "lai châu",

                  "lang son",
                  "lạng sơn",

                  "cao bang",
                  "cao bằng",

                  "bac kan",
                  "bắc kạn",

                  "tuyen quang",
                  "tuyên quang",

                  "ha giang",
                  "hà giang"
              ]


              if any(
                  keyword in combined
                  for keyword in vietnam_keywords
              ):

                  vietnam = True


              if not vietnam:

                  continue


              key = (
                  tvg_id.lower()
                  if tvg_id
                  else normalize_name(name)
              )


              if not key:

                  continue


              if key in vietnam_channels:

                  continue


              vietnam_channels[key] = (
                  extinf,
                  options,
                  url
              )


          for extinf, options, url in vietnam_channels.values():

              extinf = set_group(
                  extinf,
                  "Vietnam"
              )

              result.append(
                  (
                      "Vietnam",
                      extinf,
                      options,
                      url
                  )
              )


          # ============================================================
          # ENGLISH
          #
          # IMPORTANT:
          #
          # We do NOT use streams.json.
          #
          # We first collect the channel IDs from the English playlist.
          # Then we intersect them with the category playlist.
          #
          # This means:
          #
          # English + Kids
          # English + Education
          # English + Documentary
          # English + Movies
          # English + Series
          # English + Music
          # English + Sports
          # English + Family
          # English + Entertainment
          #
          # Pluto TV is removed.
          # ==============================================================

          english_ids = set()


          for extinf, options, url in english_entries:

              tvg_id = get_attr(
                  extinf,
                  "tvg-id"
              )


              if tvg_id:

                  english_ids.add(
                      tvg_id.lower()
                  )


          print(
              "English IDs:",
              len(english_ids)
          )


          wanted_categories = {

              "animation",
              "children",
              "kids",

              "education",

              "entertainment",

              "family",

              "movies",

              "music",

              "science",

              "series",

              "sports",

              "documentary"
          }


          blocked_words = {

              "adult",
              "xxx",
              "religious",
              "religion",
              "shopping",
              "shop",
              "weather",
              "business",
              "legislative",
              "gambling"
          }


          # Channel information from category playlist.

          english_channels = {}


          for extinf, options, url in category_entries:

              tvg_id = get_attr(
                  extinf,
                  "tvg-id"
              )

              if not tvg_id:

                  continue


              if tvg_id.lower() not in english_ids:

                  continue


              name = get_name(extinf)

              group = get_attr(
                  extinf,
                  "group-title"
              )


              low_group = group.lower()

              low_all = (
                  extinf
                  + " "
                  + name
                  + " "
                  + group
              ).lower()


              # --------------------------------------------------------
              # Remove Pluto
              # --------------------------------------------------------

              if "pluto" in low_all:

                  continue


              # --------------------------------------------------------
              # Remove unwanted categories
              # --------------------------------------------------------

              blocked = False


              for word in blocked_words:

                  if word in low_group:

                      blocked = True
                      break


              if blocked:

                  continue


              # --------------------------------------------------------
              # Determine wanted category
              # --------------------------------------------------------

              category = None


              for wanted in wanted_categories:

                  if wanted in low_group:

                      category = wanted
                      break


              if category is None:

                  continue


              # --------------------------------------------------------
              # Unique channel
              # --------------------------------------------------------

              key = tvg_id.lower()


              if key in english_channels:

                  continue


              english_channels[key] = (
                  extinf,
                  options,
                  url,
                  category
              )


          # ============================================================
          # ENGLISH FALLBACK
          #
          # Some English channels can have no category.
          #
          # Add a limited set of English channels from the direct
          # language playlist so that useful international channels
          # are not lost.
          # ==============================================================

          for extinf, options, url in english_entries:

              tvg_id = get_attr(
                  extinf,
                  "tvg-id"
              )

              if not tvg_id:

                  continue


              key = tvg_id.lower()


              if key in english_channels:

                  continue


              name = get_name(extinf)

              low = (
                  extinf
                  + " "
                  + name
              ).lower()


              if "pluto" in low:

                  continue


              # Skip obvious unwanted content.

              if any(
                  word in low
                  for word in [
                      "adult",
                      "xxx",
                      "religious",
                      "shopping",
                      "weather"
                  ]
              ):

                  continue


              # Only keep obvious international learning/news/
              # entertainment names when category metadata is absent.

              learning_words = [

                  "bbc",
                  "cnn",
                  "nhk world",
                  "dw",
                  "france 24",
                  "al jazeera",
                  "euronews",
                  "reuters",
                  "bloomberg",
                  "cnbc",
                  "nasa",
                  "discovery",
                  "national geographic",
                  "animal planet",
                  "history",
                  "smithsonian",
                  "ted",
                  "kids",
                  "cartoon",
                  "nick",
                  "nickelodeon",
                  "disney",
                  "music",
                  "sports",
                  "espn"
              ]


              if not any(
                  word in low
                  for word in learning_words
              ):

                  continue


              english_channels[key] = (
                  extinf,
                  options,
                  url,
                  "entertainment"
              )


          # ============================================================
          # ADD ENGLISH TO RESULT
          # ==============================================================

          def english_group(category):

              if category in {
                  "animation",
                  "children",
                  "kids"
              }:

                  return "English | Kids"


              if category in {
                  "education",
                  "science"
              }:

                  return "English | Education"


              if category == "documentary":

                  return "English | Documentary"


              if category in {
                  "movies",
                  "series"
              }:

                  return "English | Movies & Series"


              if category == "music":

                  return "English | Music"


              if category == "sports":

                  return "English | Sports"


              if category == "family":

                  return "English | Family"


              return "English | Entertainment"


          for extinf, options, url, category in english_channels.values():

              extinf = set_group(
                  extinf,
                  english_group(category)
              )

              result.append(
                  (
                      "English",
                      extinf,
                      options,
                      url
                  )
              )


          # ============================================================
          # ORDER
          # ==============================================================

          order = {

              "Japan": 1,
              "Vietnam": 2,
              "English": 3

          }


          result.sort(
              key=lambda item: order[item[0]]
          )


          # ============================================================
          # COUNTS
          # ==============================================================

          japan_count = sum(
              1
              for item in result
              if item[0] == "Japan"
          )


          vietnam_count = sum(
              1
              for item in result
              if item[0] == "Vietnam"
          )


          english_count = sum(
              1
              for item in result
              if item[0] == "English"
          )


          total_count = len(result)


          print("")
          print("======================================")
          print("FINAL PLAYLIST")
          print("======================================")
          print("Japan   :", japan_count)
          print("Vietnam :", vietnam_count)
          print("English :", english_count)
          print("TOTAL   :", total_count)
          print("======================================")


          # ============================================================
          # SAFETY PROTECTION
          #
          # If a source suddenly disappears, DO NOT overwrite the
          # previous working playlist.
          # ==============================================================

          if japan_count < 30:

              raise RuntimeError(
                  "Japan playlist unexpectedly small. "
                  "Existing playlist will NOT be replaced."
              )


          if vietnam_count < 50:

              raise RuntimeError(
                  "Vietnam playlist unexpectedly small. "
                  "Existing playlist will NOT be replaced."
              )


          if english_count < 50:

              raise RuntimeError(
                  "English playlist unexpectedly small. "
                  "Existing playlist will NOT be replaced."
              )


          if total_count < 170:

              raise RuntimeError(
                  "Total playlist unexpectedly small. "
                  "Existing playlist will NOT be replaced."
              )


          # ============================================================
          # EPG
          # ==============================================================

          header = (
              '#EXTM3U '
              'x-tvg-url="'
              'https://iptv-org.github.io/epg/guides/en.xml,'
              'https://iptv-org.github.io/epg/guides/ja.xml,'
              'https://iptv-org.github.io/epg/guides/vi.xml"'
          )


          # ============================================================
          # WRITE
          # ==============================================================

          with open(
              OUTPUT,
              "w",
              encoding="utf-8",
              newline="\n"
          ) as file:

              file.write(
                  header
                  + "\n"
              )


              for source, extinf, options, url in result:

                  file.write(
                      extinf
                      + "\n"
                  )


                  for option in options:

                      file.write(
                          option
                          + "\n"
                      )


                  file.write(
                      url
                      + "\n"
                  )


          print("")
          print("Playlist created successfully.")


          PY


      # ==============================================================
      # VERIFY
      # ==============================================================

      - name: Verify playlist
        shell: bash
        run: |

          echo "======================================"
          echo "VERIFY PLAYLIST"
          echo "======================================"


          if [ ! -s jp-vn.m3u ]; then

            echo "ERROR: jp-vn.m3u is empty."

            exit 1

          fi


          COUNT=$(grep -c '^#EXTINF' jp-vn.m3u || true)


          echo "Total channels: $COUNT"


          if [ "$COUNT" -lt 170 ]; then

            echo "ERROR: Playlist is unexpectedly small."

            exit 1

          fi


          echo "Playlist verification OK."


      # ==============================================================
      # COMMIT
      # ==============================================================

      - name: Commit and push
        shell: bash
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add jp-vn.m3u


          if git diff --cached --quiet; then

            echo "No changes to playlist."

            exit 0

          fi


          git commit \
            -m "Update stable JP-VN-English IPTV"


          git pull --rebase origin main


          git push origin main
