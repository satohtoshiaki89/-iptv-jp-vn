name: Update IPTV Playlist

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build playlist
        env:
          JAPAN_URL: "https://raw.githubusercontent.com/ZXArkin/my-personal-iptv/iptv-radio/Japan.m3u"
          VIETNAM_URL: "https://raw.githubusercontent.com/ZXArkin/my-personal-iptv/iptv-radio/ZXIPTV.m3u"
          ENGLISH_URL: "https://iptv-org.github.io/iptv/languages/eng.m3u"
          CATEGORY_URL: "https://iptv-org.github.io/iptv/index.category.m3u"

        run: |
          python3 <<'PY'
          import os
          import re
          import urllib.request
          from pathlib import Path

          JAPAN_URL = os.environ["JAPAN_URL"]
          VIETNAM_URL = os.environ["VIETNAM_URL"]
          ENGLISH_URL = os.environ["ENGLISH_URL"]
          CATEGORY_URL = os.environ["CATEGORY_URL"]

          OUTPUT = Path("jp-vn.m3u")
          TEMP = Path("jp-vn.m3u.tmp")

          UA = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/131.0 Safari/537.36"
          )

          # ----------------------------------------------------------
          # DOWNLOAD
          # ----------------------------------------------------------

          def download(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": UA,
                      "Accept": "*/*"
                  }
              )

              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read().decode(
                      "utf-8",
                      errors="replace"
                  )

          # ----------------------------------------------------------
          # PARSE M3U
          # ----------------------------------------------------------

          def parse_m3u(text):
              result = []
              current = None

              for line in text.splitlines():
                  line = line.strip()

                  if not line:
                      continue

                  if line.startswith("#EXTINF"):
                      current = {
                          "info": line,
                          "url": None
                      }

                  elif current and not line.startswith("#"):
                      current["url"] = line
                      result.append(current)
                      current = None

              return result

          # ----------------------------------------------------------
          # HELPERS
          # ----------------------------------------------------------

          def name(e):
              if "," in e["info"]:
                  return e["info"].split(",", 1)[1].strip()
              return ""

          def tvgid(e):
              m = re.search(
                  r'tvg-id="([^"]*)"',
                  e["info"],
                  re.I
              )
              return m.group(1).strip() if m else ""

          def set_group(e, group):
              info = e["info"]

              if re.search(
                  r'group-title="[^"]*"',
                  info,
                  re.I
              ):
                  info = re.sub(
                      r'group-title="[^"]*"',
                      f'group-title="{group}"',
                      info,
                      flags=re.I
                  )
              else:
                  info = info.replace(
                      "#EXTINF:-1",
                      f'#EXTINF:-1 group-title="{group}"',
                      1
                  )

              return {
                  "info": info,
                  "url": e["url"]
              }

          # ==========================================================
          # JAPAN
          # ==========================================================

          print("Downloading Japan...")

          japan = parse_m3u(
              download(JAPAN_URL)
          )

          japan_seen = set()
          japan_result = []

          for e in japan:
              key = (
                  tvgid(e).lower()
                  or name(e).lower()
              )

              if not key or key in japan_seen:
                  continue

              japan_seen.add(key)

              japan_result.append(
                  set_group(
                      e,
                      "🇯🇵 Japan"
                  )
              )

          print(
              "Japan:",
              len(japan_result)
          )

          # ==========================================================
          # VIETNAM
          #
          # Keep the existing Vietnam source.
          # DO NOT keyword-filter it.
          #
          # Only remove old VTV entries because we replace them with
          # better direct VTV URLs below.
          # ==========================================================

          print("Downloading Vietnam...")

          vietnam = parse_m3u(
              download(VIETNAM_URL)
          )

          def is_old_vtv(e):
              n = name(e).lower().strip()
              t = tvgid(e).lower().strip()

              if re.match(
                  r"^vtv\s*[1-9]\s*(hd)?$",
                  n
              ):
                  return True

              if re.match(
                  r"^vtv[1-9](hd)?$",
                  t
              ):
                  return True

              if re.match(
                  r"^vtv[1-9]\.vn@",
                  t
              ):
                  return True

              special = [
                  "vtv5 tây nam bộ",
                  "vtv5 tay nam bo",
                  "vtv5 tnb",
                  "vtv5 tây nguyên",
                  "vtv5 tay nguyen",
                  "vtv cần thơ",
                  "vtv can tho",
                  "vtvct",
                  "vtv10"
              ]

              text = n + " " + t

              return any(
                  x in text
                  for x in special
              )

          vietnam_result = []
          vietnam_seen = set()

          for e in vietnam:

              if is_old_vtv(e):
                  continue

              key = (
                  tvgid(e).lower()
                  or name(e).lower()
              )

              if not key or key in vietnam_seen:
                  continue

              vietnam_seen.add(key)

              # ALL non-VTV Vietnamese channels are merged here.
              vietnam_result.append(
                  set_group(
                      e,
                      "🇻🇳 Vietnam"
                  )
              )

          print(
              "Vietnam:",
              len(vietnam_result)
          )

          # ==========================================================
          # VTV DIRECT SOURCES
          #
          # Direct FPT CDN sources.
          # No GitHub stream testing.
          # ==========================================================

          VTV = [

              (
                  "VTV1",
                  "https://live.fptplay53.net/"
                  "live/media/vtv1/"
                  "live247-hls-avc/index.m3u8",
                  "https://i.imgur.com/nfkmvAY.png"
              ),

              (
                  "VTV2",
                  "https://live.fptplay53.net/"
                  "live/media/vtv2/"
                  "live247-hls-avc/index.m3u8",
                  "https://i.imgur.com/BVwi3K3.png"
              ),

              (
                  "VTV3",
                  "https://live.fptplay53.net/"
                  "live/media/vtv3/"
                  "live247-hls-avc/index.m3u8",
                  "https://i.imgur.com/7rLCvgS.png"
              ),

              (
                  "VTV4",
                  "https://live.fptplay53.net/"
                  "live/media/vtv4/"
                  "live247-hls-avc/index.m3u8",
                  "https://i.imgur.com/9zVTtsA.png"
              ),

              (
                  "VTV5",
                  "https://live.fptplay53.net/"
                  "live/media/vtv5/"
                  "live247-hls-avc/index.m3u8",
                  "https://i.imgur.com/7qPKNFU.png"
              ),

              (
                  "VTV5 Tây Nam Bộ",
                  "https://live.fptplay53.net/"
                  "live/media/vtv5tnb/"
                  "live-hls-avc/index.m3u8",
                  "https://i.imgur.com/mIUWkDx.png"
              ),

              (
                  "VTV5 Tây Nguyên",
                  "https://live.fptplay53.net/"
                  "live/media/vtv5tn/"
                  "live-hls-avc/index.m3u8",
                  "https://i.imgur.com/R8c2swd.png"
              ),

              (
                  "VTV6",
                  "https://live.fptplay53.net/"
                  "live/media/vtv6/"
                  "live247-hls-avc/index.m3u8",
                  "https://raw.githubusercontent.com/"
                  "ntd249/logochannel/refs/heads/main/VTV6.png"
              ),

              (
                  "VTV7",
                  "https://live.fptplay53.net/"
                  "live/media/vtv7/"
                  "live247-hls-avc/index.m3u8",
                  "https://i.imgur.com/AgamSNe.png"
              ),

              (
                  "VTV8",
                  "https://live.fptplay53.net/"
                  "live/media/vtv8/"
                  "live-hls-avc/index.m3u8",
                  "https://i.imgur.com/lpcltL9.png"
              ),

              (
                  "VTV9",
                  "https://live.fptplay53.net/"
                  "live/media/vtv9/"
                  "live247-hls-avc/index.m3u8",
                  "https://i.imgur.com/Ex1VkGQ.png"
              ),

              (
                  "VTV10",
                  "https://live.fptplay53.net/"
                  "live/media/vtv10/"
                  "live247-hls-avc/index.m3u8",
                  "https://raw.githubusercontent.com/"
                  "ntd249/logochannel/refs/heads/main/VTV10.png"
              )
          ]

          vtv_result = []

          for channel, url, logo in VTV:

              safe_id = (
                  channel
                  .lower()
                  .replace(" ", "")
                  .replace("â", "a")
                  .replace("đ", "d")
                  .replace("ộ", "o")
                  .replace("ô", "o")
                  .replace("ơ", "o")
                  .replace("ư", "u")
                  .replace("ă", "a")
                  .replace("ê", "e")
                  .replace("ế", "e")
              )

              info = (
                  '#EXTINF:-1 '
                  f'tvg-id="{safe_id}.vn" '
                  'group-title="🇻🇳 Vietnam | VTV" '
                  f'tvg-logo="{logo}",'
                  f'{channel} HD'
              )

              vtv_result.append({
                  "info": info,
                  "url": url
              })

          print(
              "VTV:",
              len(vtv_result)
          )

          # ==========================================================
          # ENGLISH
          # ==========================================================

          print("Downloading English...")

          english = parse_m3u(
              download(ENGLISH_URL)
          )

          categories = parse_m3u(
              download(CATEGORY_URL)
          )

          category_map = {}

          for e in categories:
              tid = tvgid(e).lower()

              if tid:
                  category_map[tid] = (
                      e["info"]
                      + " "
                      + name(e)
                  ).lower()

          # ----------------------------------------------------------
          # Desired categories
          # ----------------------------------------------------------

          category_rules = {

              "Kids": [
                  "kids",
                  "children",
                  "preschool"
              ],

              "Animation": [
                  "animation",
                  "cartoon",
                  "anime"
              ],

              "Family": [
                  "family"
              ],

              "Education": [
                  "education",
                  "educational",
                  "learning"
              ],

              "Science": [
                  "science",
                  "technology",
                  "tech"
              ],

              "Documentary": [
                  "documentary",
                  "documentaries"
              ],

              "Movies": [
                  "movie",
                  "movies",
                  "film"
              ],

              "Series": [
                  "series",
                  "drama"
              ],

              "Music": [
                  "music",
                  "musical"
              ],

              "Entertainment": [
                  "entertainment",
                  "lifestyle",
                  "culture",
                  "travel",
                  "food"
              ],

              "Sports": [
                  "sports",
                  "sport"
              ],

              "News": [
                  "news"
              ]
          }

          blocked = [
              "adult",
              "xxx",
              "porn",
              "casino",
              "gambling",
              "shopping",
              "religion",
              "religious",
              "weather",
              "business",
              "stock",
              "legislative",
              "parliament",
              "court",
              "pluto"
          ]

          # English-speaking markets
          english_countries = [
              "us",
              "gb",
              "uk",
              "ca",
              "au",
              "nz",
              "ie"
          ]

          global_english = [
              "bbc",
              "bbc news",
              "bbc earth",
              "sky news",
              "sky cinema",
              "sky arts",
              "sky max",
              "itv",
              "channel 4",
              "channel 5",
              "abc",
              "cbs",
              "nbc",
              "fox",
              "pbs",
              "cnn",
              "cnbc",
              "msnbc",
              "national geographic",
              "nat geo",
              "discovery",
              "animal planet",
              "history",
              "smithsonian",
              "nickelodeon",
              "nick jr",
              "cartoon network",
              "cartoonito",
              "boomerang",
              "disney",
              "mtv",
              "vh1",
              "espn",
              "wwe",
              "eurosport",
              "tennis channel",
              "travel channel",
              "food network"
          ]

          def has_english_country(text):

              text = text.lower()

              for c in english_countries:

                  patterns = [
                      f".{c}",
                      f"@{c}",
                      f"_{c}",
                      f"-{c}",
                      f"({c})",
                      f" {c} "
                  ]

                  if any(
                      p in text
                      for p in patterns
                  ):
                      return True

              return False

          english_result = []

          for e in english:

              tid = tvgid(e).lower()
              n = name(e).lower()
              info = e["info"].lower()
              url = e["url"].lower()

              full = (
                  tid
                  + " "
                  + n
                  + " "
                  + info
                  + " "
                  + url
                  + " "
                  + category_map.get(tid, "")
              )

              if any(
                  x in full
                  for x in blocked
              ):
                  continue

              if not has_english_country(full):

                  if not any(
                      brand in full
                      for brand in global_english
                  ):
                      continue

              chosen_category = None

              for category, keywords in category_rules.items():

                  if any(
                      k in full
                      for k in keywords
                  ):

                      chosen_category = category
                      break

              if chosen_category is None:
                  continue

              e = set_group(
                  e,
                  f"🇬🇧 English | {chosen_category}"
              )

              english_result.append(e)

          # ----------------------------------------------------------
          # Deduplicate English
          # ----------------------------------------------------------

          english_seen = {}

          for e in english_result:

              key = (
                  tvgid(e).lower()
                  or name(e).lower()
              )

              if not key:
                  continue

              if key not in english_seen:

                  english_seen[key] = e

              else:

                  old = english_seen[key]

                  old_info = old["info"].lower()
                  new_info = e["info"].lower()

                  old_hd = (
                      " hd" in old_info
                      or "1080" in old_info
                      or "720" in old_info
                  )

                  new_hd = (
                      " hd" in new_info
                      or "1080" in new_info
                      or "720" in new_info
                  )

                  if new_hd and not old_hd:
                      english_seen[key] = e

          english_result = list(
              english_seen.values()
          )

          print(
              "English:",
              len(english_result)
          )

          # ==========================================================
          # FINAL
          # ==========================================================

          final = (
              japan_result
              + vietnam_result
              + vtv_result
              + english_result
          )

          total = len(final)

          print("")
          print("========================================")
          print("FINAL RESULT")
          print("========================================")
          print("Japan   :", len(japan_result))
          print("Vietnam :", len(vietnam_result))
          print("VTV     :", len(vtv_result))
          print("English :", len(english_result))
          print("TOTAL   :", total)
          print("========================================")

          # ==========================================================
          # SAFETY
          # ==========================================================

          if len(japan_result) < 30:
              raise RuntimeError(
                  "Japan source unexpectedly small."
              )

          if len(vietnam_result) < 50:
              raise RuntimeError(
                  "Vietnam source unexpectedly small."
              )

          if len(vtv_result) < 9:
              raise RuntimeError(
                  "VTV list was not generated correctly."
              )

          if len(english_result) < 500:
              raise RuntimeError(
                  "English list unexpectedly small."
              )

          if total < 800:
              raise RuntimeError(
                  "Final playlist unexpectedly small."
              )

          # ==========================================================
          # WRITE
          # ==========================================================

          lines = [
              "#EXTM3U",
              "",
              "# ========================================",
              "# 🇯🇵 JAPAN",
              "# ========================================"
          ]

          for e in japan_result:
              lines.append(e["info"])
              lines.append(e["url"])

          lines += [
              "",
              "# ========================================",
              "# 🇻🇳 VIETNAM",
              "# ========================================"
          ]

          for e in vietnam_result:
              lines.append(e["info"])
              lines.append(e["url"])

          lines += [
              "",
              "# ========================================",
              "# 🇻🇳 VIETNAM | VTV",
              "# ========================================"
          ]

          for e in vtv_result:
              lines.append(e["info"])
              lines.append(e["url"])

          lines += [
              "",
              "# ========================================",
              "# 🇬🇧 ENGLISH",
              "# ========================================"
          ]

          for e in english_result:
              lines.append(e["info"])
              lines.append(e["url"])

          TEMP.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          # Final validation
          content = TEMP.read_text(
              encoding="utf-8"
          )

          count = content.count("#EXTINF")

          if count < 800:
              raise RuntimeError(
                  "Generated playlist is too small."
              )

          # Only replace after ALL checks pass.
          TEMP.replace(OUTPUT)

          print("")
          print(
              "SUCCESS:",
              count,
              "channels"
          )
          PY

      - name: Verify
        run: |
          test -s jp-vn.m3u

          COUNT=$(grep -c '^#EXTINF' jp-vn.m3u || true)

          echo "Final channels: $COUNT"

          if [ "$COUNT" -lt 800 ]; then
            echo "ERROR: Playlist too small."
            exit 1
          fi

          echo "Playlist verification OK."

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jp-vn.m3u

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update IPTV Japan Vietnam English"
            git push
          fi
