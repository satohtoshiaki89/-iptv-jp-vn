name: Update JP-VN IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build IPTV playlist
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import re
          import urllib.request
          from collections import defaultdict

          CHANNELS_URL = "https://iptv-org.github.io/api/channels.json"
          FEEDS_URL    = "https://iptv-org.github.io/api/feeds.json"
          STREAMS_URL  = "https://iptv-org.github.io/api/streams.json"

          # Nhật: dùng internal stream list để lấy được nhiều kênh hơn
          JAPAN_STREAMS_URL = "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/jp.m3u"

          OUTPUT = "jp-vn.m3u"

          UA = "Mozilla/5.0 IPTV-Builder/1.0"

          ENGLISH_COUNTRIES = {
              "US", "GB", "CA", "AU", "NZ", "IE"
          }

          ENGLISH_CATEGORIES = {
              "animation",
              "children",
              "kids",
              "education",
              "entertainment",
              "family",
              "movies",
              "music",
              "science",
              "series",
              "sports",
              "documentary"
          }

          LEARNING_CATEGORIES = {
              "animation",
              "children",
              "kids",
              "education",
              "family",
              "science",
              "documentary"
          }

          BLOCKED_CATEGORIES = {
              "adult",
              "xxx",
              "religious",
              "shop",
              "shopping",
              "weather",
              "business",
              "legislative"
          }

          def download(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read().decode("utf-8", errors="replace")

          def get_json(url):
              return json.loads(download(url))

          print("Downloading IPTV database...")

          channels = get_json(CHANNELS_URL)
          feeds    = get_json(FEEDS_URL)
          streams  = get_json(STREAMS_URL)

          channel_by_id = {
              c["id"]: c for c in channels
              if c.get("id")
          }

          # ------------------------------------------------------------
          # LANGUAGE MAP
          # Current iptv-org API stores languages in feeds.json
          # ------------------------------------------------------------

          channel_languages = defaultdict(set)

          for f in feeds:
              cid = f.get("channel")
              if not cid:
                  continue

              for lang in f.get("languages") or []:
                  channel_languages[cid].add(lang.lower())

          # ------------------------------------------------------------
          # LOGO
          # ------------------------------------------------------------

          logo_map = {}

          try:
              logos = get_json("https://iptv-org.github.io/api/logos.json")

              for logo in logos:
                  cid = logo.get("channel")
                  url = logo.get("url")

                  if cid and url and cid not in logo_map:
                      if logo.get("in_use", True):
                          logo_map[cid] = url

          except Exception as e:
              print("Logo download warning:", e)

          # ------------------------------------------------------------
          # STREAM QUALITY SCORING
          # ------------------------------------------------------------

          def quality_number(q):
              if not q:
                  return 0

              m = re.search(r"(\d+)", str(q))

              if m:
                  return int(m.group(1))

              return 0

          def stream_score(s):
              url = (s.get("url") or "").lower()

              labels = [
                  str(x).lower()
                  for x in (s.get("labels") or [])
              ]

              score = 0

              if url.startswith("https://"):
                  score += 100

              if ".m3u8" in url:
                  score += 80

              score += quality_number(s.get("quality")) // 10

              if "geo-blocked" in labels:
                  score -= 250

              if "not 24/7" in labels:
                  score -= 80

              if "offline" in labels:
                  score -= 1000

              return score

          # ------------------------------------------------------------
          # SELECT BEST STREAM PER CHANNEL
          # ------------------------------------------------------------

          streams_by_channel = defaultdict(list)

          for s in streams:
              cid = s.get("channel")
              url = s.get("url")

              if cid and url:
                  streams_by_channel[cid].append(s)

          best_stream = {}

          for cid, items in streams_by_channel.items():
              items = sorted(
                  items,
                  key=stream_score,
                  reverse=True
              )

              if items:
                  best_stream[cid] = items[0]

          # ------------------------------------------------------------
          # OUTPUT STORAGE
          # ------------------------------------------------------------

          output_entries = []
          used_keys = set()

          counts = {
              "Japan": 0,
              "Vietnam": 0,
              "English": 0
          }

          def clean_name(name):
              name = re.sub(
                  r"\s*\((?:2160|1440|1080|720|576|540|480|360)p\)\s*",
                  " ",
                  name,
                  flags=re.I
              )

              name = re.sub(
                  r"\s+",
                  " ",
                  name
              ).strip()

              return name

          def add_entry(
              name,
              url,
              group,
              country_group,
              tvg_id="",
              logo="",
              referrer=None,
              user_agent=None
          ):
              if not name or not url:
                  return

              name = clean_name(name)

              key = (
                  tvg_id.lower().strip()
                  if tvg_id
                  else name.lower().strip()
              )

              dedupe_key = (country_group, key)

              if dedupe_key in used_keys:
                  return

              used_keys.add(dedupe_key)

              attrs = []

              if tvg_id:
                  attrs.append(
                      f'tvg-id="{tvg_id}"'
                  )

              if logo:
                  attrs.append(
                      f'tvg-logo="{logo}"'
                  )

              attrs.append(
                  f'group-title="{group}"'
              )

              extinf = (
                  '#EXTINF:-1 '
                  + " ".join(attrs)
                  + ","
                  + name
              )

              lines = [extinf]

              if referrer:
                  lines.append(
                      "#EXTVLCOPT:http-referrer="
                      + str(referrer)
                  )

              if user_agent:
                  lines.append(
                      "#EXTVLCOPT:http-user-agent="
                      + str(user_agent)
                  )

              lines.append(url)

              output_entries.append(
                  "\n".join(lines)
              )

              counts[country_group] += 1

          # ============================================================
          # JAPAN
          # ============================================================
          # Use streams/jp.m3u because the public country playlist
          # contains fewer channels.
          # Deduplicate by tvg-id/name.
          # Prefer first valid occurrence in repository order.
          # ============================================================

          print("Building Japan...")

          try:
              jp_text = download(JAPAN_STREAMS_URL)

              lines = jp_text.splitlines()

              current_info = None
              current_referrer = None
              current_ua = None

              for raw in lines:
                  line = raw.strip()

                  if not line:
                      continue

                  if line.startswith("#EXTINF:"):
                      current_info = line
                      current_referrer = None
                      current_ua = None
                      continue

                  if line.startswith("#EXTVLCOPT:http-referrer="):
                      current_referrer = line.split("=", 1)[1]
                      continue

                  if line.startswith("#EXTVLCOPT:http-user-agent="):
                      current_ua = line.split("=", 1)[1]
                      continue

                  if line.startswith("#"):
                      continue

                  if not current_info:
                      continue

                  url = line

                  if not (
                      url.startswith("http://")
                      or url.startswith("https://")
                  ):
                      current_info = None
                      continue

                  # Get tvg-id
                  m_id = re.search(
                      r'tvg-id="([^"]*)"',
                      current_info
                  )

                  tvg_id = (
                      m_id.group(1).strip()
                      if m_id
                      else ""
                  )

                  # Name after final comma
                  if "," in current_info:
                      name = current_info.split(",", 1)[1].strip()
                  else:
                      name = tvg_id or "Japan TV"

                  # Try matching metadata/logo
                  base_id = tvg_id

                  if "@" in base_id:
                      base_id = base_id.split("@", 1)[0]

                  logo = (
                      logo_map.get(tvg_id)
                      or logo_map.get(base_id)
                      or ""
                  )

                  add_entry(
                      name=name,
                      url=url,
                      group="Japan",
                      country_group="Japan",
                      tvg_id=tvg_id,
                      logo=logo,
                      referrer=current_referrer,
                      user_agent=current_ua
                  )

                  current_info = None
                  current_referrer = None
                  current_ua = None

          except Exception as e:
              print("Japan internal playlist warning:", e)

          # ------------------------------------------------------------
          # JAPAN FALLBACK
          # If internal playlist ever fails, use API data.
          # ------------------------------------------------------------

          if counts["Japan"] == 0:
              print("Japan fallback to API...")

              for cid, c in channel_by_id.items():

                  if (c.get("country") or "").upper() != "JP":
                      continue

                  s = best_stream.get(cid)

                  if not s:
                      continue

                  add_entry(
                      name=c.get("name") or s.get("title") or cid,
                      url=s.get("url"),
                      group="Japan",
                      country_group="Japan",
                      tvg_id=cid,
                      logo=logo_map.get(cid, ""),
                      referrer=s.get("referrer"),
                      user_agent=s.get("user_agent")
                  )

          # ============================================================
          # VIETNAM
          # ============================================================
          # Include Vietnamese-language channels.
          # Do not restrict sports/music/etc.
          # ============================================================

          print("Building Vietnam...")

          for cid, c in channel_by_id.items():

              languages = channel_languages.get(cid, set())

              country = (
                  c.get("country")
                  or ""
              ).upper()

              is_vietnamese = (
                  "vie" in languages
                  or country == "VN"
              )

              if not is_vietnamese:
                  continue

              if c.get("is_nsfw"):
                  continue

              s = best_stream.get(cid)

              if not s:
                  continue

              add_entry(
                  name=c.get("name") or s.get("title") or cid,
                  url=s.get("url"),
                  group="Vietnam",
                  country_group="Vietnam",
                  tvg_id=cid,
                  logo=logo_map.get(cid, ""),
                  referrer=s.get("referrer"),
                  user_agent=s.get("user_agent")
              )

          # ============================================================
          # ENGLISH
          # ============================================================

          print("Building English...")

          def english_group(categories):
              cats = set(categories)

              if cats & {"animation", "children", "kids"}:
                  return "English | Kids"

              if "education" in cats or "science" in cats:
                  return "English | Education"

              if "documentary" in cats:
                  return "English | Documentary"

              if cats & {"movies", "series"}:
                  return "English | Movies & Series"

              if "music" in cats:
                  return "English | Music"

              if "sports" in cats:
                  return "English | Sports"

              if "family" in cats:
                  return "English | Family"

              return "English | Entertainment"

          for cid, c in channel_by_id.items():

              languages = channel_languages.get(cid, set())

              if "eng" not in languages:
                  continue

              if c.get("is_nsfw"):
                  continue

              categories = {
                  str(x).lower()
                  for x in (c.get("categories") or [])
              }

              if categories & BLOCKED_CATEGORIES:
                  continue

              allowed = categories & ENGLISH_CATEGORIES

              if not allowed:
                  continue

              country = (
                  c.get("country")
                  or ""
              ).upper()

              # Entertainment/movies/music/sports/series:
              # restrict mainly to major English-speaking countries.
              #
              # Learning/kids/science/documentary/family:
              # allow English channels internationally.
              if not (categories & LEARNING_CATEGORIES):
                  if country not in ENGLISH_COUNTRIES:
                      continue

              s = best_stream.get(cid)

              if not s:
                  continue

              group = english_group(categories)

              add_entry(
                  name=c.get("name") or s.get("title") or cid,
                  url=s.get("url"),
                  group=group,
                  country_group="English",
                  tvg_id=cid,
                  logo=logo_map.get(cid, ""),
                  referrer=s.get("referrer"),
                  user_agent=s.get("user_agent")
              )

          # ============================================================
          # WRITE PLAYLIST
          # ============================================================

          header = (
              '#EXTM3U '
              'x-tvg-url="https://iptv-org.github.io/epg/guides/en.xml,'
              'https://iptv-org.github.io/epg/guides/ja.xml,'
              'https://iptv-org.github.io/epg/guides/vi.xml"'
          )

          with open(
              OUTPUT,
              "w",
              encoding="utf-8",
              newline="\n"
          ) as f:

              f.write(header + "\n")

              for entry in output_entries:
                  f.write(entry + "\n")

          print("")
          print("==============================")
          print("PLAYLIST CREATED")
          print("==============================")
          print("Japan   :", counts["Japan"])
          print("Vietnam :", counts["Vietnam"])
          print("English :", counts["English"])
          print("TOTAL   :", sum(counts.values()))
          print("==============================")

          if sum(counts.values()) < 50:
              raise RuntimeError(
                  "Playlist unexpectedly too small. "
                  "Stopping to protect existing playlist."
              )

          PY

      - name: Verify playlist
        shell: bash
        run: |
          echo "Checking jp-vn.m3u..."

          if [ ! -s jp-vn.m3u ]; then
            echo "ERROR: jp-vn.m3u is empty."
            exit 1
          fi

          CHANNELS=$(grep -c '^#EXTINF' jp-vn.m3u || true)

          echo "Channels in playlist: $CHANNELS"

          if [ "$CHANNELS" -lt 50 ]; then
            echo "ERROR: Playlist contains too few channels."
            exit 1
          fi

          echo "Playlist OK."

      - name: Commit updated playlist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jp-vn.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update JP-VN IPTV playlist"

          git pull --rebase origin main

          git push origin main
