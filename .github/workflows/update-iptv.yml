name: Update JP-VN IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Japanese, Vietnamese and English playlists
        run: |
          python - <<'PY'
          import urllib.request

          sources = [
              ("JAPANESE", "https://iptv-org.github.io/iptv/languages/jpn.m3u"),
              ("VIETNAMESE", "https://iptv-org.github.io/iptv/languages/vie.m3u"),
              ("ENGLISH", "https://iptv-org.github.io/iptv/languages/eng.m3u"),
          ]

          output = ["#EXTM3U"]
          seen_urls = set()

          for language, url in sources:
              print(f"Downloading {language}:")
              print(url)

              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  with urllib.request.urlopen(request, timeout=60) as response:
                      data = response.read().decode(
                          "utf-8",
                          errors="ignore"
                      )

                  print(f"{language} downloaded successfully")

                  lines = data.splitlines()
                  i = 0
                  count = 0

                  while i < len(lines):
                      if lines[i].startswith("#EXTINF") and i + 1 < len(lines):
                          info = lines[i]
                          stream_url = lines[i + 1].strip()

                          if stream_url and stream_url not in seen_urls:
                              output.append(info)
                              output.append(stream_url)
                              seen_urls.add(stream_url)
                              count += 1

                          i += 2
                      else:
                          i += 1

                  print(f"{language}: {count} channels added")

              except Exception as error:
                  print(f"{language} FAILED: {error}")

          with open("jp-vn.m3u", "w", encoding="utf-8") as file:
              file.write("\n".join(output))
              file.write("\n")

          print("================================")
          print("Playlist created successfully")
          print(f"Total unique channels: {len(seen_urls)}")
          print("================================")
          PY

      - name: Commit playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jp-vn.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update JP-VN English IPTV playlist"

          git pull --rebase origin main

          git push origin main
