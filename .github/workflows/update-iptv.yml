name: Update JP-VN IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build JP-VN-English IPTV playlist
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import re

          API_BASE = "https://iptv-org.github.io/api"

          CHANNELS_URL = f"{API_BASE}/channels.json"
          FEEDS_URL = f"{API_BASE}/feeds.json"
          STREAMS_URL = f"{API_BASE}/streams.json"

          def download_json(url):
              print(f"Downloading: {url}")

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.loads(
                      response.read().decode("utf-8", errors="ignore")
                  )

          print("================================")
          print("Downloading iptv-org API data")
          print("================================")

          channels = download_json(CHANNELS_URL)
          feeds = download_json(FEEDS_URL)
          streams = download_json(STREAMS_URL)

          print(f"Channels: {len(channels)}")
          print(f"Feeds: {len(feeds)}")
          print(f"Streams: {len(streams)}")

          # ---------------------------------------------------------
          # SETTINGS
          # ---------------------------------------------------------

          JAPANESE_LANGS = {
              "jpn"
          }

          VIETNAMESE_LANGS = {
              "vie"
          }

          ENGLISH_LANGS = {
              "eng"
          }

          ENGLISH_ALLOWED_CATEGORIES = {
              "animation",
              "children",
              "education",
              "entertainment",
              "family",
              "movies",
              "music",
              "series",
              "science",
              "sports",
              "documentary"
          }

          ENGLISH_BLOCKED_CATEGORIES = {
              "adult",
              "business",
              "legislative",
              "religious",
              "shopping",
              "weather"
          }

          BLOCKED_NAME_WORDS = {
              "pluto tv",
              "pluto"
          }

          # ---------------------------------------------------------
          # CHANNEL INFORMATION
          # ---------------------------------------------------------

          channel_map = {}

          for channel in channels:
              channel_id = channel.get("id")

              if channel_id:
                  channel_map[channel_id] = channel

          # ---------------------------------------------------------
          # FEED INFORMATION
          # ---------------------------------------------------------

          feed_map = {}

          for feed in feeds:
              feed_id = feed.get("id")

              if feed_id:
                  feed_map[feed_id] = feed

          # ---------------------------------------------------------
          # STREAM INFORMATION
          # ---------------------------------------------------------

          streams_by_channel = {}

          for stream in streams:
              channel_id = stream.get("channel")

              if not channel_id:
                  continue

              streams_by_channel.setdefault(channel_id, []).append(stream)

          # ---------------------------------------------------------
          # HELPER FUNCTIONS
          # ---------------------------------------------------------

          def get_languages(channel):
              values = channel.get("languages", [])

              result = set()

              if isinstance(values, list):
                  for value in values:
                      if isinstance(value, str):
                          result.add(value.lower())

              return result

          def get_categories(channel):
              values = channel.get("categories", [])

              result = set()

              if isinstance(values, list):
                  for value in values:
                      if isinstance(value, str):
                          result.add(value.lower())

              return result

          def get_channel_name(channel):
              return (
                  channel.get("name")
                  or channel.get("alt_name")
                  or channel.get("id")
                  or "Unknown"
              )

          def is_blocked_name(name):
              name_lower = name.lower()

              for word in BLOCKED_NAME_WORDS:
                  if word in name_lower:
                      return True

              return False

          def stream_score(stream):
              score = 0

              url = str(stream.get("url", "")).lower()

              # Prefer HLS
              if ".m3u8" in url:
                  score += 50

              # Prefer HTTPS
              if url.startswith("https://"):
                  score += 20

              # Prefer streams with quality information
              quality = str(stream.get("quality", "")).lower()

              if "1080" in quality:
                  score += 30
              elif "720" in quality:
                  score += 20
              elif "576" in quality:
                  score += 10

              # Prefer streams marked as working
              if stream.get("status") == "online":
                  score += 50

              return score

          # ---------------------------------------------------------
          # SELECT CHANNELS
          # ---------------------------------------------------------

          selected = {}

          for channel_id, channel in channel_map.items():

              name = get_channel_name(channel)

              if is_blocked_name(name):
                  continue

              languages = get_languages(channel)
              categories = get_categories(channel)

              # ---------------------------------------------
              # JAPANESE
              # ---------------------------------------------

              if languages & JAPANESE_LANGS:
                  selected[channel_id] = {
                      "channel": channel,
                      "type": "JAPANESE"
                  }
                  continue

              # ---------------------------------------------
              # VIETNAMESE
              # ---------------------------------------------

              if languages & VIETNAMESE_LANGS:
                  selected[channel_id] = {
                      "channel": channel,
                      "type": "VIETNAMESE"
                  }
                  continue

              # ---------------------------------------------
              # ENGLISH
              # ---------------------------------------------

              if languages & ENGLISH_LANGS:

                  if categories & ENGLISH_BLOCKED_CATEGORIES:
                      continue

                  if categories & ENGLISH_ALLOWED_CATEGORIES:
                      selected[channel_id] = {
                          "channel": channel,
                          "type": "ENGLISH"
                      }

          print("================================")
          print(f"Selected channels: {len(selected)}")
          print("================================")

          # ---------------------------------------------------------
          # CREATE PLAYLIST
          # ---------------------------------------------------------

          output = [
              "#EXTM3U",
              ""
          ]

          used_urls = set()

          counts = {
              "JAPANESE": 0,
              "VIETNAMESE": 0,
              "ENGLISH": 0
          }

          for channel_id, item in sorted(
              selected.items(),
              key=lambda x: (
                  x[1]["type"],
                  get_channel_name(x[1]["channel"]).lower()
              )
          ):

              channel = item["channel"]
              channel_type = item["type"]

              channel_name = get_channel_name(channel)

              channel_streams = streams_by_channel.get(
                  channel_id,
                  []
              )

              if not channel_streams:
                  continue

              # Remove streams without URL
              valid_streams = []

              for stream in channel_streams:

                  url = stream.get("url")

                  if not url:
                      continue

                  if not isinstance(url, str):
                      continue

                  url = url.strip()

                  if not url.startswith(("http://", "https://")):
                      continue

                  valid_streams.append(stream)

              if not valid_streams:
                  continue

              # Choose the highest scoring stream
              valid_streams.sort(
                  key=stream_score,
                  reverse=True
              )

              chosen = None

              for stream in valid_streams:
                  url = stream.get("url", "").strip()

                  if url and url not in used_urls:
                      chosen = stream
                      break

              if not chosen:
                  continue

              stream_url = chosen.get("url", "").strip()

              used_urls.add(stream_url)

              categories = get_categories(channel)

              if channel_type == "JAPANESE":
                  group = "Japan"

              elif channel_type == "VIETNAMESE":
                  group = "Vietnam"

              else:
                  if "children" in categories or "animation" in categories:
                      group = "English | Kids"

                  elif "education" in categories or "science" in categories:
                      group = "English | Education"

                  elif "documentary" in categories:
                      group = "English | Documentary"

                  elif "movies" in categories or "series" in categories:
                      group = "English | Movies & Series"

                  elif "music" in categories:
                      group = "English | Music"

                  elif "sports" in categories:
                      group = "English | Sports"

                  elif "family" in categories:
                      group = "English | Family"

                  else:
                      group = "English | Entertainment"

              tvg_id = channel.get("id", "")
              logo = channel.get("logo", "")

              extinf = (
                  f'#EXTINF:-1'
                  f' tvg-id="{tvg_id}"'
                  f' tvg-name="{channel_name}"'
                  f' group-title="{group}"'
              )

              if logo:
                  extinf += f' tvg-logo="{logo}"'

              extinf += f',{channel_name}'

              output.append(extinf)
              output.append(stream_url)
              output.append("")

              counts[channel_type] += 1

          # ---------------------------------------------------------
          # WRITE FILE
          # ---------------------------------------------------------

          with open(
              "jp-vn.m3u",
              "w",
              encoding="utf-8"
          ) as file:

              file.write("\n".join(output))
              file.write("\n")

          print("================================")
          print("PLAYLIST CREATED")
          print("================================")
          print(f"Japanese : {counts['JAPANESE']}")
          print(f"Vietnam  : {counts['VIETNAMESE']}")
          print(f"English  : {counts['ENGLISH']}")
          print("--------------------------------")
          print(f"TOTAL    : {len(used_urls)}")
          print("================================")
          PY

      - name: Commit playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jp-vn.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update JP-VN IPTV playlist"

          git pull --rebase origin main

          git push origin main
