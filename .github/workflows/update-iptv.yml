name: Update JP-VN IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build IPTV playlist
        run: |
          python - <<'PY'
          import json
          import urllib.request

          API = "https://iptv-org.github.io/api"

          JAPAN_PLAYLIST = (
              "https://iptv-org.github.io/iptv/countries/jp.m3u"
          )

          def get_json(url):
              print("Downloading:", url)

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(
                  request,
                  timeout=180
              ) as response:

                  return json.loads(
                      response.read().decode(
                          "utf-8",
                          errors="ignore"
                      )
                  )

          def get_text(url):
              print("Downloading:", url)

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(
                  request,
                  timeout=180
              ) as response:

                  return response.read().decode(
                      "utf-8",
                      errors="ignore"
                  )

          print("========================================")
          print("Downloading iptv-org API")
          print("========================================")

          channels = get_json(
              f"{API}/channels.json"
          )

          feeds = get_json(
              f"{API}/feeds.json"
          )

          streams = get_json(
              f"{API}/streams.json"
          )

          print("Channels:", len(channels))
          print("Feeds:", len(feeds))
          print("Streams:", len(streams))

          # ========================================================
          # SETTINGS
          # ========================================================

          JAPANESE = "jpn"
          VIETNAMESE = "vie"
          ENGLISH = "eng"

          ENGLISH_ALLOWED = {
              "animation",
              "children",
              "education",
              "entertainment",
              "family",
              "movies",
              "music",
              "science",
              "series",
              "sports",
              "documentary"
          }

          BLOCKED_CATEGORIES = {
              "adult",
              "religious",
              "shopping",
              "shop",
              "weather",
              "business",
              "legislative"
          }

          ENGLISH_MAIN_COUNTRIES = {
              "us",
              "gb",
              "ca",
              "au",
              "nz",
              "ie"
          }

          # ========================================================
          # HELPERS
          # ========================================================

          def get_name(channel):
              return (
                  channel.get("name")
                  or channel.get("native_name")
                  or channel.get("id")
                  or "Unknown"
              )

          def get_categories(channel):
              value = channel.get(
                  "categories",
                  []
              )

              result = set()

              if isinstance(value, list):
                  for item in value:
                      if isinstance(item, str):
                          result.add(
                              item.lower()
                          )

              return result

          def get_country(channel):
              value = channel.get(
                  "country",
                  ""
              )

              if isinstance(value, str):
                  return value.lower()

              return ""

          def get_languages(feed):
              value = feed.get(
                  "languages",
                  []
              )

              result = set()

              if isinstance(value, list):
                  for item in value:
                      if isinstance(item, str):
                          result.add(
                              item.lower()
                          )

              return result

          def blocked_name(name):
              text = name.lower()

              blocked_words = [
                  "pluto tv",
                  "pluto",
                  "adult",
                  "porn",
                  "xxx"
              ]

              return any(
                  word in text
                  for word in blocked_words
              )

          # ========================================================
          # CHANNEL MAP
          # ========================================================

          channel_map = {}

          for channel in channels:

              channel_id = channel.get(
                  "id"
              )

              if channel_id:
                  channel_map[channel_id] = channel

          # ========================================================
          # FEEDS
          # ========================================================

          feeds_by_channel = {}

          for feed in feeds:

              channel_id = feed.get(
                  "channel"
              )

              feed_id = feed.get(
                  "id"
              )

              if not channel_id or not feed_id:
                  continue

              feeds_by_channel.setdefault(
                  channel_id,
                  []
              ).append(feed)

          # ========================================================
          # STREAMS
          # ========================================================

          streams_by_channel = {}

          for stream in streams:

              channel_id = stream.get(
                  "channel"
              )

              if not channel_id:
                  continue

              streams_by_channel.setdefault(
                  channel_id,
                  []
              ).append(stream)

          # ========================================================
          # STREAM SCORE
          # ========================================================

          def stream_score(stream):

              score = 0

              url = str(
                  stream.get(
                      "url",
                      ""
                  )
              ).lower()

              quality = str(
                  stream.get(
                      "quality",
                      ""
                  )
              ).lower()

              status = str(
                  stream.get(
                      "status",
                      ""
                  )
              ).lower()

              label = str(
                  stream.get(
                      "label",
                      ""
                  )
              ).lower()

              if url.startswith(
                  "https://"
              ):
                  score += 30

              if ".m3u8" in url:
                  score += 40

              if "1080" in quality:
                  score += 30

              elif "720" in quality:
                  score += 20

              elif "576" in quality:
                  score += 10

              if status == "online":
                  score += 50

              if "geo" in label:
                  score -= 100

              if "blocked" in label:
                  score -= 100

              return score

          # ========================================================
          # START PLAYLIST
          # ========================================================

          output = [
              "#EXTM3U"
          ]

          used_urls = set()
          used_channel_ids = set()

          count_japan = 0
          count_vietnam = 0
          count_english = 0

          # ========================================================
          # JAPAN
          #
          # IMPORTANT:
          # Use the official iptv-org Japan country playlist.
          # This avoids losing Japanese channels because of
          # feed/stream API relationships.
          # ========================================================

          print("")
          print("========================================")
          print("Adding Japanese channels")
          print("========================================")

          japan_data = get_text(
              JAPAN_PLAYLIST
          )

          japan_lines = japan_data.splitlines()

          i = 0

          while i < len(japan_lines):

              if (
                  japan_lines[i].startswith("#EXTINF")
                  and i + 1 < len(japan_lines)
              ):

                  info = japan_lines[i]
                  url = japan_lines[i + 1].strip()

                  if (
                      url
                      and url.startswith(
                          ("http://", "https://")
                      )
                      and url not in used_urls
                  ):

                      # Add Japan group
                      if "group-title=" in info:

                          start = info.find(
                              'group-title="'
                          )

                          if start >= 0:

                              start += len(
                                  'group-title="'
                              )

                              end = info.find(
                                  '"',
                                  start
                              )

                              if end >= 0:

                                  info = (
                                      info[:start]
                                      + "Japan"
                                      + info[end:]
                                  )

                      else:

                          comma = info.rfind(",")

                          if comma >= 0:

                              name = info[
                                  comma + 1:
                              ].strip()

                              info = (
                                  info[:comma]
                                  + ' group-title="Japan",'
                                  + name
                              )

                      output.append(info)
                      output.append(url)

                      used_urls.add(url)

                      count_japan += 1

                  i += 2

              else:
                  i += 1

          print(
              "Japanese channels:",
              count_japan
          )

          # ========================================================
          # VIETNAM + ENGLISH
          # ========================================================

          candidates = []

          for channel_id, channel in channel_map.items():

              name = get_name(channel)

              if blocked_name(name):
                  continue

              channel_categories = get_categories(
                  channel
              )

              if (
                  channel_categories
                  & BLOCKED_CATEGORIES
              ):
                  continue

              country = get_country(
                  channel
              )

              channel_feeds = feeds_by_channel.get(
                  channel_id,
                  []
              )

              for feed in channel_feeds:

                  feed_id = feed.get(
                      "id"
                  )

                  feed_languages = get_languages(
                      feed
                  )

                  # ------------------------------------------------
                  # VIETNAM
                  # ------------------------------------------------

                  if VIETNAMESE in feed_languages:

                      candidates.append({
                          "channel_id": channel_id,
                          "feed_id": feed_id,
                          "type": "VIETNAM",
                          "channel": channel,
                          "feed": feed
                      })

                      continue

                  # ------------------------------------------------
                  # ENGLISH
                  # ------------------------------------------------

                  if ENGLISH in feed_languages:

                      wanted = (
                          channel_categories
                          & ENGLISH_ALLOWED
                      )

                      if not wanted:
                          continue

                      learning_categories = {
                          "children",
                          "animation",
                          "education",
                          "science",
                          "documentary"
                      }

                      learning_channel = bool(
                          channel_categories
                          & learning_categories
                      )

                      entertainment_categories = {
                          "movies",
                          "series",
                          "music",
                          "family",
                          "entertainment",
                          "sports"
                      }

                      entertainment_channel = bool(
                          channel_categories
                          & entertainment_categories
                      )

                      if learning_channel:

                          candidates.append({
                              "channel_id": channel_id,
                              "feed_id": feed_id,
                              "type": "ENGLISH",
                              "channel": channel,
                              "feed": feed
                          })

                      elif (
                          entertainment_channel
                          and country
                          in ENGLISH_MAIN_COUNTRIES
                      ):

                          candidates.append({
                              "channel_id": channel_id,
                              "feed_id": feed_id,
                              "type": "ENGLISH",
                              "channel": channel,
                              "feed": feed
                          })

          print("")
          print("========================================")
          print(
              "Vietnam/English candidate feeds:",
              len(candidates)
          )
          print("========================================")

          # ========================================================
          # ADD VIETNAM + ENGLISH
          # ========================================================

          for candidate in sorted(
              candidates,
              key=lambda x: (
                  x["type"],
                  get_name(
                      x["channel"]
                  ).lower()
              )
          ):

              channel = candidate[
                  "channel"
              ]

              feed = candidate[
                  "feed"
              ]

              channel_id = candidate[
                  "channel_id"
              ]

              feed_id = candidate[
                  "feed_id"
              ]

              channel_type = candidate[
                  "type"
              ]

              name = get_name(
                  channel
              )

              # One channel only
              if channel_id in used_channel_ids:
                  continue

              channel_streams = (
                  streams_by_channel.get(
                      channel_id,
                      []
                  )
              )

              valid_streams = []

              for stream in channel_streams:

                  url = stream.get(
                      "url"
                  )

                  if not url:
                      continue

                  if not isinstance(
                      url,
                      str
                  ):
                      continue

                  url = url.strip()

                  if not url.startswith(
                      ("http://", "https://")
                  ):
                      continue

                  stream_feed = stream.get(
                      "feed"
                  )

                  if stream_feed:

                      if stream_feed != feed_id:
                          continue

                  valid_streams.append(
                      stream
                  )

              if not valid_streams:
                  continue

              valid_streams.sort(
                  key=stream_score,
                  reverse=True
              )

              chosen = None

              for stream in valid_streams:

                  url = stream.get(
                      "url",
                      ""
                  ).strip()

                  if url in used_urls:
                      continue

                  chosen = stream
                  break

              if not chosen:
                  continue

              stream_url = chosen.get(
                  "url",
                  ""
              ).strip()

              used_urls.add(
                  stream_url
              )

              used_channel_ids.add(
                  channel_id
              )

              # ------------------------------------------------
              # GROUP
              # ------------------------------------------------

              if channel_type == "VIETNAM":

                  group = "Vietnam"

                  count_vietnam += 1

              else:

                  cats = get_categories(
                      channel
                  )

                  if (
                      "children" in cats
                      or "animation" in cats
                  ):

                      group = (
                          "English | Kids"
                      )

                  elif (
                      "education" in cats
                      or "science" in cats
                  ):

                      group = (
                          "English | Education"
                      )

                  elif "documentary" in cats:

                      group = (
                          "English | Documentary"
                      )

                  elif (
                      "movies" in cats
                      or "series" in cats
                  ):

                      group = (
                          "English | Movies & Series"
                      )

                  elif "music" in cats:

                      group = (
                          "English | Music"
                      )

                  elif "sports" in cats:

                      group = (
                          "English | Sports"
                      )

                  elif "family" in cats:

                      group = (
                          "English | Family"
                      )

                  else:

                      group = (
                          "English | Entertainment"
                      )

                  count_english += 1

              # ------------------------------------------------
              # METADATA
              # ------------------------------------------------

              tvg_id = channel.get(
                  "id",
                  ""
              )

              logo = channel.get(
                  "logo",
                  ""
              )

              extinf = (
                  '#EXTINF:-1'
                  f' tvg-id="{tvg_id}"'
                  f' tvg-name="{name}"'
                  f' group-title="{group}"'
              )

              if logo:

                  extinf += (
                      f' tvg-logo="{logo}"'
                  )

              extinf += (
                  f',{name}'
              )

              output.append(
                  extinf
              )

              output.append(
                  stream_url
              )

          # ========================================================
          # WRITE PLAYLIST
          # ========================================================

          with open(
              "jp-vn.m3u",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  "\n".join(output)
              )

              file.write("\n")

          total = (
              count_japan
              + count_vietnam
              + count_english
          )

          print("")
          print("========================================")
          print("PLAYLIST CREATED SUCCESSFULLY")
          print("========================================")
          print("Japan    :", count_japan)
          print("Vietnam  :", count_vietnam)
          print("English  :", count_english)
          print("----------------------------------------")
          print("TOTAL    :", total)
          print("========================================")

          if total == 0:
              raise RuntimeError(
                  "Playlist contains 0 channels."
              )

          PY

      - name: Check playlist
        run: |
          echo "Checking playlist..."

          if [ ! -s jp-vn.m3u ]; then
            echo "ERROR: jp-vn.m3u is empty."
            exit 1
          fi

          CHANNEL_COUNT=$(grep -c "^#EXTINF" jp-vn.m3u || true)

          echo "Playlist channel count: $CHANNEL_COUNT"

          if [ "$CHANNEL_COUNT" -eq 0 ]; then
            echo "ERROR: No channels found."
            exit 1
          fi

          echo "Playlist check OK."

      - name: Commit playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jp-vn.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update JP-VN IPTV playlist"

          git pull --rebase origin main

          git push origin main
